<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030b">
<title>MAZE CHOMP — Neon Arcade</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap');

:root{
  --bg:#03030a;
  --panel:#090713;
  --blue:#20a7ff;
  --blue2:#006cff;
  --purple:#9b45ff;
  --purple2:#5c1fff;
  --yellow:#ffe600;
  --pink:#ff3d71;
  --cyan:#20e6ff;
  --text:#f8f7ff;
  --muted:#9e96b8;
  --safe:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 50% 10%,#171033 0%,#080512 35%,#020207 80%);
  color:var(--text);
  font-family:Orbitron,system-ui,sans-serif;
  overflow:hidden;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.screen{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:18px;
  position:relative;
}

.screen.active{
  display:flex;
}

/* =========================
   BACKGROUND
========================= */

.bg-grid{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.2;

  background-image:
    linear-gradient(#8e49ff18 1px,transparent 1px),
    linear-gradient(90deg,#8e49ff18 1px,transparent 1px);

  background-size:34px 34px;

  mask-image:
    radial-gradient(
      ellipse at center,
      #000 0%,
      #000 45%,
      transparent 90%
    );

  animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
  from{
    background-position:0 0,0 0;
  }
  to{
    background-position:34px 34px,34px 34px;
  }
}

/* =========================
   MENU
========================= */

.logo{
  font-size:clamp(42px,9vw,88px);
  font-weight:900;
  letter-spacing:6px;
  text-align:center;
  color:#fff;
  margin:0 0 8px;

  text-shadow:
    0 0 6px #fff,
    0 0 18px var(--purple),
    0 0 35px var(--purple),
    0 0 70px var(--blue);

  animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    filter:brightness(1);
  }
  50%{
    filter:brightness(1.18);
  }
}

.subtitle{
  color:#bcb2d7;
  letter-spacing:4px;
  font-size:clamp(9px,2vw,15px);
  margin-bottom:34px;
  text-align:center;
}

.menu{
  width:min(460px,92vw);
  display:grid;
  gap:12px;
}

.neon-btn{
  min-height:54px;
  padding:13px 18px;

  border:1px solid #3caeff;
  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      rgba(28,18,50,.95),
      rgba(7,6,17,.98)
    );

  box-shadow:
    inset 0 0 18px #742cff14,
    0 0 10px #168cff20;

  transition:
    transform .18s cubic-bezier(.2,.8,.2,1),
    box-shadow .18s ease,
    border-color .18s ease,
    background .18s ease;

  letter-spacing:1.5px;
  position:relative;
  overflow:hidden;
}

.neon-btn::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.08) 50%,
      transparent 75%
    );

  transform:translateX(-120%);
  transition:transform .5s ease;
}

.neon-btn:hover::before{
  transform:translateX(120%);
}

.neon-btn:hover{
  transform:translateY(-3px);

  border-color:#62c1ff;

  box-shadow:
    0 0 18px #168cff66,
    0 0 35px #8c35ff28,
    inset 0 0 18px #742cff20;
}

.neon-btn:active,
.neon-btn.pressed{
  transform:scale(.95);

  box-shadow:
    0 0 28px #168cffaa,
    inset 0 0 25px #8c35ff35;
}

/* =========================
   PANELS
========================= */

.panel{
  width:min(620px,94vw);
  max-height:88vh;
  overflow:auto;

  background:
    linear-gradient(
      145deg,
      rgba(17,10,30,.97),
      rgba(5,5,13,.98)
    );

  border:1px solid #713eff99;
  border-radius:22px;

  padding:24px;

  box-shadow:
    0 0 40px #6d28d933,
    0 25px 70px #0008;

  backdrop-filter:blur(15px);

  animation:panelIn .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.panel h2{
  text-align:center;
  margin:0 0 18px;
  color:#fff;

  text-shadow:
    0 0 8px #fff,
    0 0 18px var(--purple);
}

.panel p,
.panel li{
  font-family:system-ui,sans-serif;
  line-height:1.65;
  color:#d0c8df;
}

.back{
  margin-top:16px;
  width:100%;
}

/* =========================
   SETTINGS
========================= */

.setting-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 0;
}

.setting-row>label{
  align-self:center;
  color:#cfc6e2;
  font-size:13px;
  letter-spacing:1px;
}

.choice{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.choice.two{
  grid-template-columns:repeat(2,1fr);
}

.choice button{
  min-height:44px;
  padding:8px;

  border-radius:10px;
  background:#100b1e;
  border:1px solid #3e3159;

  color:#aaa0c8;
  font-size:11px;

  transition:.18s ease;
}

.choice button:hover{
  border-color:#7046c9;
  transform:translateY(-1px);
}

.choice button.on{
  color:#fff;
  border-color:#8c4cff;

  box-shadow:
    0 0 13px #8c4cff55,
    inset 0 0 12px #8c4cff22;

  background:#221238;
}

/* =========================
   GAME
========================= */

#gameScreen{
  padding:0;
  justify-content:flex-start;
}

.game-shell{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

  position:relative;

  padding:
    10px
    max(10px,env(safe-area-inset-left))
    calc(8px + var(--safe))
    max(10px,env(safe-area-inset-right));

  touch-action:none;
  user-select:none;
}

/* =========================
   HUD
========================= */

.hud{
  width:min(920px,96vw);

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;

  margin-bottom:8px;
  flex:0 0 auto;
}

.hud-box{
  position:relative;

  background:
    linear-gradient(
      145deg,
      rgba(13,10,26,.96),
      rgba(5,5,12,.96)
    );

  border:1px solid #5630a0;
  border-radius:12px;

  padding:8px;

  text-align:center;

  box-shadow:
    0 0 14px #682dff20,
    inset 0 0 12px #ffffff03;

  overflow:hidden;
}

.hud-box::after{
  content:"";
  position:absolute;
  left:15%;
  right:15%;
  bottom:0;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #20a7ff,
      transparent
    );

  opacity:.7;
}

.hud-label{
  font-size:8px;
  color:#9287aa;
  letter-spacing:1.5px;
}

.hud-value{
  font-size:clamp(12px,2.2vw,18px);
  font-weight:800;
  margin-top:3px;

  text-shadow:
    0 0 10px rgba(255,255,255,.15);
}

.lives{
  letter-spacing:2px;
  color:#ff557f;

  text-shadow:
    0 0 8px #ff3d78,
    0 0 20px #ff3d7844;
}

/* =========================
   BOARD
========================= */

.board-wrap{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:0;
  flex:1;
  width:100%;

  touch-action:none;
}

#gameCanvas{
  display:block;

  background:
    radial-gradient(
      circle at center,
      #050916,
      #02030a 75%
    );

  border:2px solid #1263d0;
  border-radius:12px;

  box-shadow:
    0 0 12px #168cff77,
    0 0 30px #168cff38,
    0 0 75px #8a32ff25,
    inset 0 0 30px #001d4d;

  touch-action:none;

  transition:
    box-shadow .25s ease,
    transform .12s ease;
}

/* =========================
   TOP CONTROLS
========================= */

.top-controls{
  position:absolute;
  right:8px;
  top:8px;

  display:flex;
  gap:7px;
  z-index:5;
}

.small-btn{
  min-width:44px;
  min-height:44px;
  padding:8px 10px;

  border:1px solid #7546d8;
  border-radius:11px;

  background:#080610dd;

  box-shadow:
    0 0 12px #7e3fff33,
    inset 0 0 12px #7e3fff0d;

  font-size:11px;

  transition:.15s ease;
}

.small-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 18px #7e3fff66;
}

/* =========================
   DPAD
========================= */

.dpad{
  display:none;

  position:relative;

  width:min(190px,48vw);
  height:min(190px,48vw);

  margin-top:8px;
  flex:0 0 auto;
}

.dpad button{
  position:absolute;

  width:clamp(54px,15vw,68px);
  height:clamp(54px,15vw,68px);

  border:1px solid #20a7ff;
  border-radius:17px;

  background:
    linear-gradient(
      180deg,
      #171032,
      #080712
    );

  box-shadow:
    0 0 14px #20a7ff55,
    inset 0 0 18px #8c35ff22;

  font-size:25px;
  color:#fff;

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.dpad button:active{
  box-shadow:
    0 0 28px #20a7ffcc,
    inset 0 0 20px #20a7ff33;
}

.up{
  left:50%;
  top:0;
  transform:translateX(-50%);
}

.down{
  left:50%;
  bottom:0;
  transform:translateX(-50%);
}

.left{
  left:0;
  top:50%;
  transform:translateY(-50%);
}

.right{
  right:0;
  top:50%;
  transform:translateY(-50%);
}

.center{
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  border-color:#9b45ff!important;
  color:#9b45ff!important;
}

/* =========================
   OVERLAYS
========================= */

.overlay{
  position:absolute;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:#03020ad9;

  backdrop-filter:blur(7px);

  z-index:20;

  animation:overlayFade .25s ease;
}

.overlay.show{
  display:flex;
}

@keyframes overlayFade{
  from{opacity:0}
  to{opacity:1}
}

.overlay-card{
  width:min(430px,88vw);

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(18,10,31,.98),
      rgba(5,4,12,.99)
    );

  border:1px solid #8048ff;

  border-radius:22px;

  padding:25px;

  box-shadow:
    0 0 45px #7d39ff55,
    0 25px 80px #000b;

  animation:cardPop .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardPop{
  from{
    opacity:0;
    transform:scale(.9) translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.overlay-card h2{
  margin:0 0 16px;

  font-size:clamp(24px,7vw,38px);

  text-shadow:
    0 0 10px #fff,
    0 0 20px #9b45ff,
    0 0 40px #9b45ff66;
}

.overlay-card .neon-btn{
  width:100%;
  margin-top:9px;
}

/* =========================
   TOAST
========================= */

#toast{
  position:fixed;

  top:15px;
  left:50%;

  transform:
    translateX(-50%)
    translateY(-15px);

  opacity:0;

  z-index:99;

  padding:10px 16px;

  border:1px solid #20a7ff;
  border-radius:20px;

  background:#080611ee;

  box-shadow:
    0 0 20px #20a7ff44;

  font-size:11px;

  transition:.25s;

  pointer-events:none;
}

#toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

.lowfx *{
  animation:none!important;
  filter:none!important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .screen{
    padding:12px;
  }

  .menu{
    gap:9px;
  }

  .neon-btn{
    min-height:50px;
  }

  .panel{
    padding:18px;
  }

  .setting-row{
    grid-template-columns:1fr;
  }

  .choice{
    grid-template-columns:repeat(3,1fr);
  }

  .hud{
    gap:4px;
    width:96vw;
  }

  .hud-box{
    padding:5px 3px;
  }

  .hud-label{
    font-size:7px;
  }

  .hud-value{
    font-size:11px;
  }

  .small-btn{
    min-width:44px;
    min-height:44px;
    font-size:9px;
  }

  #gameCanvas{
    border-radius:9px;
  }
}

@media(pointer:coarse){
  .dpad{
    display:block;
  }
}

@media(max-height:620px) and (orientation:landscape){

  .game-shell{
    padding-top:5px;
  }

  .hud{
    margin-bottom:3px;
  }

  .hud-box{
    padding:3px;
  }

  .dpad{
    display:none!important;
  }

  .board-wrap{
    padding-right:5px;
  }
}

@media(max-width:390px) and (orientation:portrait){

  .rotate-hint{
    display:block;
  }
}

.rotate-hint{
  display:none;

  position:absolute;
  z-index:10;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(420px,90vw);

  padding:20px;

  text-align:center;

  border:1px solid #9b45ff;
  border-radius:18px;

  background:#080511ed;

  box-shadow:0 0 35px #9b45ff55;

  color:#fff;

  font-size:13px;
  line-height:1.7;
}
</style>

const DIR = {

  up:{x:0,y:-1},

  down:{x:0,y:1},

  left:{x:-1,y:0},

  right:{x:1,y:0}

};


const dirs = [

  DIR.up,

  DIR.left,

  DIR.down,

  DIR.right

];


let tile = 20;

let ox = 0;

let oy = 0;


let player;

let ghosts = [];

let dots = [];

let pellets = [];

let particles = [];


let powerTimer = 0;

/* =========================================
   UTILITY
========================================= */

function saveSettings(){

  localStorage.setItem(
    "mazeChompSettings",
    JSON.stringify(settings)
  );

}


function show(name){

  Object.values(screens)
    .forEach(s=>s.classList.remove("active"));

  screens[name].classList.add("active");

  setTimeout(resizeCanvas,20);

}


function toast(t){

  const e = $("#toast");

  e.textContent = t;

  e.classList.add("show");

  clearTimeout(toast.t);

  toast.t =
    setTimeout(
      ()=>e.classList.remove("show"),
      1200
    );

}


function vibrate(ms=20){

  if(
    settings.vibration &&
    navigator.vibrate
  ){

    navigator.vibrate(ms);

  }

}


function beep(

  freq=440,

  dur=.05,

  type="square",

  vol=.025

){

  if(!settings.sound) return;

  try{

    audioCtx ||= new(
      window.AudioContext ||
      window.webkitAudioContext
    )();

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type = type;

    o.frequency.value = freq;

    g.gain.value = vol;

    o.connect(g);

    g.connect(audioCtx.destination);

    o.start();

    g.gain.exponentialRampToValueAtTime(

      .0001,

      audioCtx.currentTime + dur

    );

    o.stop(
      audioCtx.currentTime + dur
    );

  }catch(e){}

}


function buttonFx(e){

  e.currentTarget.classList.add("pressed");

  setTimeout(
    ()=>e.currentTarget.classList.remove("pressed"),
    120
  );

  vibrate(10);

}


$$("button")
  .forEach(
    b=>b.addEventListener(
      "pointerdown",
      buttonFx
    )
  );


/* =========================================
   MAZE HELPERS
========================================= */

function mazeAt(x,y){

  if(
    y<0 ||
    y>=H ||
    x<0 ||
    x>=W
  ) return " ";

  return mazeRows[y][x] || " ";

}


function isWall(x,y){

  return mazeAt(x,y) === "#";

}


function wrapX(x){

  if(x < -.5)
    return W-.5;

  if(x > W-.5)
    return -.5;

  return x;

}


/* =========================================
   MAP
========================================= */

function resetMap(){

  dots=[];

  pellets=[];

  for(
    let y=0;
    y<H;
    y++
  ){

    for(
      let x=0;
      x<W;
      x++
    ){

      const c =
        mazeAt(x,y);

      if(c === "."){

        dots.push({
          x,
          y,
          alive:true
        });

      }

      if(c === "*"){

        pellets.push({
          x,
          y,
          alive:true
        });

      }

    }

  }

}


/* =========================================
   ACTORS
========================================= */

function newPlayer(){

  return {

    x:14,

    y:26,

    dir:{x:0,y:0},

    next:{x:0,y:0},

    speed:.125,

    mouth:0,

    bob:0

  };

}


function ghost(x,y,i){

  return {

    x,

    y,

    homeX:x,

    homeY:y,

    dir:dirs[i%4],

    type:i,

    mode:"chase",

    speed:.078 + level*.0035,

    fright:0,

    scatter:false,

    phase:Math.random()*3

  };

}


function resetActors(){

  player =
    newPlayer();

  ghosts = [

    ghost(13,14,0),

    ghost(14,14,1),

    ghost(15,14,2),

    ghost(16,14,3)

  ];

  ghosts.forEach(

    (g,i)=>{
      g.color =
        ghostColors[i];
    }

  );

  powerTimer=0;

  combo=0;

}


/* =========================================
   GAME START
========================================= */

function startGame(){

  score=0;

  level=1;

  lives=3;

  dotsCollected=0;

  gameState="playing";

  shake=0;

  particles=[];

  resetMap();

  resetActors();

  show("game");

  hideOverlay();

  updateHud();

  last=performance.now();

  cancelAnimationFrame(raf);

  raf =
    requestAnimationFrame(loop);

  beep(330,.08);

  setTimeout(
    ()=>beep(550,.1),
    100
  );

}


function restartLevel(){

  resetMap();

  resetActors();

  gameState="playing";

  hideOverlay();

  last=performance.now();

}


/* =========================================
   SCORE
========================================= */

function addScore(n){

  score += n;

  if(score > highScore){

    highScore = score;

    localStorage.setItem(
      "mazeChompHighScore",
      highScore
    );

  }

  updateHud();

}


function updateHud(){

  $("#score").textContent =
    String(score).padStart(6,"0");

  $("#highScore").textContent =
    String(highScore).padStart(6,"0");

  $("#level").textContent =
    level;

  $("#lives").textContent =
    "♥ ".repeat(
      Math.max(0,lives)
    ).trim() || "—";

}


/* =========================================
   MOVEMENT
========================================= */

function moveEntity(e,dt){

  const speed =
    e.speed *
    (dt/16.6667);

  let nx =
    e.x +
    e.dir.x*speed;

  let ny =
    e.y +
    e.dir.y*speed;


  if(e===player){

    nx = wrapX(nx);

  }


  if(e.dir.x !== 0){

    const checkX =
      e.dir.x > 0
      ? Math.floor(nx+.38)
      : Math.floor(nx-.38);

    if(
      isWall(
        checkX,
        Math.round(e.y)
      )
    ){

      nx =
        Math.round(e.x);

      e.dir =
        {x:0,y:0};

    }

  }


  if(e.dir.y !== 0){

    const checkY =
      e.dir.y > 0
      ? Math.floor(ny+.38)
      : Math.floor(ny-.38);

    if(
      isWall(
        Math.round(e.x),
        checkY
      )
    ){

      ny =
        Math.round(e.y);

      e.dir =
        {x:0,y:0};

    }

  }


  e.x=nx;

  e.y=ny;

}


function atCenter(e){

  return (

    Math.abs(
      e.x-Math.round(e.x)
    )<.12 &&

    Math.abs(
      e.y-Math.round(e.y)
    )<.12

  );

}


function tryTurn(){

  if(
    !player.next.x &&
    !player.next.y
  ) return;


  const cx =
    Math.round(player.x);

  const cy =
    Math.round(player.y);


  const tx =
    cx + player.next.x;

  const ty =
    cy + player.next.y;


  if(!isWall(tx,ty)){

    if(

      Math.abs(player.x-cx)<.20 &&
      Math.abs(player.y-cy)<.20

    ){

      player.x=cx;

      player.y=cy;

      player.dir={

        x:player.next.x,

        y:player.next.y

      };

      player.next={
        x:0,
        y:0
      };

    }

  }

}


/* =========================================
   PLAYER UPDATE
========================================= */

function updatePlayer(dt){

  tryTurn();

  moveEntity(
    player,
    dt
  );

  tryTurn();


  player.mouth +=
    dt*.012;

  player.bob +=
    dt*.008;


  const cx =
    Math.round(player.x);

  const cy =
    Math.round(player.y);


  /* DOTS */

  for(const d of dots){

    if(

      d.alive &&
      d.x===cx &&
      d.y===cy

    ){

      d.alive=false;

      dotsCollected++;

      addScore(10);

      beep(
        650,
        .025,
        "square",
        .012
      );

      spawn(
        cx+.5,
        cy+.5,
        4
      );

    }

  }


  /* POWER PELLETS */

  for(const p of pellets){

    if(

      p.alive &&
      p.x===cx &&
      p.y===cy

    ){

      p.alive=false;

      dotsCollected++;

      addScore(50);

      powerTimer=7;

      combo=0;

      ghosts.forEach(
        g=>g.fright=7
      );

      beep(
        180,
        .15,
        "sawtooth",
        .035
      );

      vibrate(30);

      spawn(
        cx+.5,
        cy+.5,
        24
      );

      shake=5;

    }

  }


  if(

    !dots.some(d=>d.alive) &&
    !pellets.some(p=>p.alive)

  ){

    levelComplete();

  }

}


/* =========================================
   GHOST AI
========================================= */

function chooseGhostDir(g){

  const x =
    Math.round(g.x);

  const y =
    Math.round(g.y);


  let target;


  if(powerTimer>0){

    target={

      x:
        Math.round(player.x)+
        (Math.random()>.5?4:-4),

      y:
        Math.round(player.y)+
        (Math.random()>.5?4:-4)

    };

  }

  else if(g.type===0){

    target={

      x:Math.round(player.x),

      y:Math.round(player.y)

    };

  }

  else if(g.type===1){

    target={

      x:
        Math.round(player.x)+
        player.dir.x*4,

      y:
        Math.round(player.y)+
        player.dir.y*4

    };

  }

  else if(g.type===2){

    target={

      x:
        Math.floor(Math.random()*W),

      y:
        Math.floor(Math.random()*H)

    };

  }

  else{

    target =
      g.scatter

      ? {
          x:g.homeX,
          y:g.homeY
        }

      : {

          x:
            Math.round(player.x)-
            player.dir.y*4,

          y:
            Math.round(player.y)+
            player.dir.x*4

        };

  }


  let options =
    dirs.filter(

      d=>

        !(
          d.x===-g.dir.x &&
          d.y===-g.dir.y
        )

        &&

        !isWall(
          x+d.x,
          y+d.y
        )

    );


  if(!options.length){

    options =
      dirs.filter(
        d=>
          !isWall(
            x+d.x,
            y+d.y
          )
      );

  }


  options.sort(

    (a,b)=>{

      const da =
        (x+a.x-target.x)**2+
        (y+a.y-target.y)**2;

      const db =
        (x+b.x-target.x)**2+
        (y+b.y-target.y)**2;

      return powerTimer>0
        ? db-da
        : da-db;

    }

  );


  g.dir =
    options[
      Math.floor(
        Math.random()*
        Math.min(
          2,
          options.length
        )
      )
    ] ||
    options[0];

}


/* =========================================
   GHOST UPDATE
========================================= */

function updateGhosts(dt){

  powerTimer =
    Math.max(
      0,
      powerTimer-dt/1000
    );


  ghosts.forEach(g=>{

    if(powerTimer<=0){

      g.fright=0;

    }else{

      g.fright=
        powerTimer;

    }


    if(atCenter(g)){

      chooseGhostDir(g);

    }


    moveEntity(
      g,
      dt
    );


    const dx =
      g.x-player.x;

    const dy =
      g.y-player.y;


    if(
      dx*dx+dy*dy<.42
    ){

      if(g.fright>0){

        const vals=[
          200,
          400,
          800,
          1600
        ];

        const v =
          vals[
            Math.min(
              combo,
              3
            )
          ];

        addScore(v);

        combo++;

        g.x=g.homeX;

        g.y=g.homeY;

        g.fright=0;

        beep(
          880,
          .12,
          "square",
          .04
        );

        vibrate(35);

        spawn(
          player.x,
          player.y,
          22
        );

        shake=3;

      }

      else{

        playerHit();

      }

    }


    g.phase +=
      dt/1000;

    g.scatter =
      Math.floor(
        g.phase/6
      )%2===1;

  });

}


/* =========================================
   PLAYER HIT
========================================= */

function playerHit(){

  if(
    gameState!=="playing"
  ) return;


  lives--;

  updateHud();

  vibrate(100);

  beep(
    90,
    .22,
    "sawtooth",
    .045
  );

  spawn(
    player.x,
    player.y,
    28
  );

  shake=10;


  if(lives<=0){

    gameOver();

    return;

  }


  player.x=14;

  player.y=26;

  player.dir={
    x:0,
    y:0
  };

  player.next={
    x:0,
    y:0
  };


  ghosts.forEach(

    (g,i)=>{

      g.x=g.homeX;

      g.y=g.homeY;

      g.dir=
        dirs[i%4];

    }

  );

}


/* =========================================
   LEVEL COMPLETE
========================================= */

function levelComplete(){

  gameState="level";

  const bonus =
    500+level*100;

  addScore(bonus);

  beep(700,.12);

  setTimeout(
    ()=>beep(950,.15),
    130
  );

  vibrate(60);

  shake=7;


  showMessage(

    "LEVEL COMPLETE",

    `BONUS +${bonus}
     <br>
     <small>
     Get ready for Level ${level+1}
     </small>`,

    [

      {

        t:"▶ NEXT LEVEL",

        fn:()=>{

          level++;

          restartLevel();

        }

      }

    ]

  );

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

  gameState="over";

  localStorage.setItem(
    "mazeChompHighScore",
    highScore
  );


  showMessage(

    "GAME OVER",

    `FINAL SCORE
     <b>${String(score).padStart(6,"0")}</b>
     <br>
     HIGH SCORE
     <b>${String(highScore).padStart(6,"0")}</b>
     <br>
     LEVEL REACHED
     <b>${level}</b>
     <br>
     DOTS COLLECTED
     <b>${dotsCollected}</b>`,

    [

      {
        t:"↻ PLAY AGAIN",
        fn:startGame
      },

      {

        t:"⌂ MAIN MENU",

        fn:()=>{

          hideOverlay();

          show("menu");

          gameState="menu";

        }

      }

    ]

  );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  title,
  body,
  buttons
){

  const c =
    $("#messageCard");


  c.innerHTML =
    `<h2>${title}</h2>
     <div
       style="
       line-height:2;
       color:#d8d0e8;
       font-size:13px
       "
     >
       ${body}
     </div>`;


  buttons.forEach(b=>{

    const x =
      document.createElement("button");

    x.className="neon-btn";

    x.textContent=b.t;

    x.onclick=()=>{

      $("#messageOverlay")
        .classList.remove("show");

      b.fn();

    };

    c.appendChild(x);

  });


  $("#messageOverlay")
    .classList.add("show");

}


function hideOverlay(){

  $("#messageOverlay")
    .classList.remove("show");

  $("#pauseOverlay")
    .classList.remove("show");

}


/* =========================================
   PAUSE
========================================= */

function pause(){

  if(
    gameState==="playing"
  ){

    gameState="paused";

    $("#pauseOverlay")
      .classList.add("show");

  }

}


function resume(){

  if(
    gameState==="paused"
  ){

    gameState="playing";

    $("#pauseOverlay")
      .classList.remove("show");

    last=performance.now();

  }

}


/* =========================================
   PARTICLES
========================================= */

function spawn(
  x,
  y,
  n
){

  if(
    lowFx &&
    n>8
  ) n=8;


  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,

      y,

      vx:
        (Math.random()-.5)*.12,

      vy:
        (Math.random()-.5)*.12,

      life:
        .4+
        Math.random()*.7,

      size:
        .05+
        Math.random()*.09

    });

  }

}


function updateParticles(dt){

  particles.forEach(p=>{

    p.x +=
      p.vx*dt;

    p.y +=
      p.vy*dt;

    p.life -=
      dt/1000;

  });


  particles =
    particles.filter(
      p=>p.life>0
    );

}


/* =========================================
   DRAW
========================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();


  /* SCREEN SHAKE */

  if(shake>0){

    const power=shake;

    ctx.translate(

      (Math.random()-.5)*power,

      (Math.random()-.5)*power

    );

    shake *= .88;

    if(shake<.1)
      shake=0;

  }


  ctx.translate(
    ox,
    oy
  );


  const glow =
    !lowFx;


  /* =====================================
     MAZE
  ===================================== */

  for(
    let y=0;
    y<H;
    y++
  ){

    for(
      let x=0;
      x<W;
      x++
    ){

      if(!isWall(x,y))
        continue;


      const wallGradient =
        ctx.createLinearGradient(

          x*tile,
          y*tile,

          (x+1)*tile,
          (y+1)*tile

        );


      wallGradient.addColorStop(
        0,
        "#07152f"
      );

      wallGradient.addColorStop(
        .5,
        "#041024"
      );

      wallGradient.addColorStop(
        1,
        "#020816"
      );


      ctx.fillStyle =
        wallGradient;


      ctx.fillRect(

        x*tile,
        y*tile,
        tile,
        tile

      );


      ctx.strokeStyle =
        glow
        ? "#20a7ff"
        : "#1473c2";


      ctx.lineWidth =
        Math.max(
          1.2,
          tile*.065
        );


      ctx.shadowBlur =
        glow
        ? tile*.65
        : 0;


      ctx.shadowColor =
        "#168cff";


      /* TOP */

      if(!isWall(x,y-1)){

        ctx.beginPath();

        ctx.moveTo(
          x*tile,
          y*tile+.5
        );

        ctx.lineTo(
          (x+1)*tile,
          y*tile+.5
        );

        ctx.stroke();

      }


      /* RIGHT */

      if(!isWall(x+1,y)){

        ctx.beginPath();

        ctx.moveTo(
          (x+1)*tile,
          y*tile
        );

        ctx.lineTo(
          (x+1)*tile,
          (y+1)*tile
        );

        ctx.stroke();

      }


      /* BOTTOM */

      if(!isWall(x,y+1)){

        ctx.beginPath();

        ctx.moveTo(
          x*tile,
          (y+1)*tile-.5
        );

        ctx.lineTo(
          (x+1)*tile,
          (y+1)*tile-.5
        );

        ctx.stroke();

      }


      /* LEFT */

      if(!isWall(x-1,y)){

        ctx.beginPath();

        ctx.moveTo(
          x*tile,
          y*tile
        );

        ctx.lineTo(
          x*tile,
          (y+1)*tile
        );

        ctx.stroke();

      }

    }

  }


  ctx.shadowBlur=0;


  /* =====================================
     DOTS
  ===================================== */

  dots.forEach(d=>{

    if(!d.alive)
      return;


    const pulse =
      1+
      Math.sin(

        performance.now()/180+
        d.x*.7+
        d.y*.4

      )*.10;


    const x =
      (d.x+.5)*tile;

    const y =
      (d.y+.5)*tile;


    const r =
      tile*.085*pulse;


    ctx.fillStyle =
      "#d9ecff";


    ctx.shadowBlur =
      glow
      ? tile*.28
      : 0;


    ctx.shadowColor =
      "#20a7ff";


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  ctx.shadowBlur=0;


  /* =====================================
     POWER PELLETS
  ===================================== */

  pellets.forEach(p=>{

    if(!p.alive)
      return;


    const pulse =
      1+
      Math.sin(
        performance.now()/130
      )*.18;


    const x =
      (p.x+.5)*tile;

    const y =
      (p.y+.5)*tile;


    const r =
      tile*.25*pulse;


    if(glow){

      ctx.shadowBlur =
        tile*.9;

      ctx.shadowColor =
        "#ffffff";

    }


    ctx.fillStyle =
      "#ffffff";


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.globalAlpha=.20;

    ctx.fillStyle =
      "#20a7ff";


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      r*1.8,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.globalAlpha=1;

  });


  /* =====================================
     GHOSTS
  ===================================== */

  ghosts.forEach(drawGhost);


  /* =====================================
     PLAYER
  ===================================== */

  drawPlayer();


  /* =====================================
     PARTICLES
  ===================================== */

  particles.forEach(p=>{

    ctx.globalAlpha =
      Math.max(
        0,
        p.life
      );


    ctx.fillStyle =
      "#fff";


    ctx.shadowBlur =
      glow
      ? 8
      : 0;


    ctx.shadowColor =
      "#9b45ff";


    ctx.beginPath();

    ctx.arc(

      p.x*tile,

      p.y*tile,

      tile*p.size,

      0,
      Math.PI*2

    );

    ctx.fill();

  });


  ctx.globalAlpha=1;

  ctx.shadowBlur=0;

  ctx.restore();

}


/* =========================================
   PLAYER DRAW
========================================= */

function drawPlayer(){

  const px =
    player.x*tile+
    tile/2;


  const py =
    player.y*tile+
    tile/2;


  const bob =
    Math.sin(
      player.bob
    )*
    tile*.035;


  const r =
    tile*.42;


  let ang=0;


  if(player.dir.x===1)
    ang=0;

  if(player.dir.x===-1)
    ang=Math.PI;

  if(player.dir.y===1)
    ang=Math.PI/2;

  if(player.dir.y===-1)
    ang=-Math.PI/2;


  const mouth =
    (
      .10+
      Math.abs(
        Math.sin(
          player.mouth
        )
      )*.30
    )*Math.PI;


  ctx.save();


  ctx.translate(
    px,
    py+bob
  );


  if(!lowFx){

    ctx.shadowBlur =
      tile*.9;

    ctx.shadowColor =
      "#ffe600";

  }


  ctx.fillStyle =
    "#ffe600";


  ctx.beginPath();

  ctx.moveTo(
    0,
    0
  );


  ctx.arc(

    0,
    0,
    r,

    ang+mouth,

    ang+
    Math.PI*2-
    mouth

  );


  ctx.closePath();

  ctx.fill();


  ctx.shadowBlur=0;


  /* HIGHLIGHT */

  ctx.globalAlpha=.28;

  ctx.fillStyle =
    "#fff7a0";


  ctx.beginPath();

  ctx.arc(

    -r*.18,

    -r*.20,

    r*.35,

    0,
    Math.PI*2

  );

  ctx.fill();


  ctx.globalAlpha=1;


  ctx.restore();

}


/* =========================================
   GHOST DRAW
========================================= */

function drawGhost(g){

  const float =
    Math.sin(
      g.phase*4
    )*
    tile*.035;


  const x =
    g.x*tile+
    tile/2;


  const y =
    g.y*tile+
    tile/2+
    float;


  const r =
    tile*.40;


  const col =
    g.fright>0

    ? (

        Math.floor(
          performance.now()/180
        )%2

        ? "#e9f7ff"
        : "#2d69ff"

      )

    : g.color;


  ctx.save();


  if(!lowFx){

    ctx.shadowBlur =
      tile*.65;

    ctx.shadowColor =
      col;

  }


  ctx.fillStyle=col;


  /* HEAD */

  ctx.beginPath();

  ctx.arc(

    x,

    y-r*.05,

    r,

    Math.PI,

    0

  );


  /* WAVY BODY */

  ctx.lineTo(
    x+r,
    y+r*.72
  );

  ctx.lineTo(
    x+r*.55,
    y+r*.48
  );

  ctx.lineTo(
    x+r*.10,
    y+r*.75
  );

  ctx.lineTo(
    x-r*.35,
    y+r*.48
  );

  ctx.lineTo(
    x-r,
    y+r*.75
  );

  ctx.closePath();

  ctx.fill();


  ctx.shadowBlur=0;


  /* EYES */

  const eyeY =
    y-r*.15;


  const eyeOffset =
    r*.18;


  ctx.fillStyle="#fff";


  ctx.beginPath();


  ctx.ellipse(

    x-eyeOffset,

    eyeY,

    r*.14,

    r*.19,

    0,

    0,
    Math.PI*2

  );


  ctx.ellipse(

    x+eyeOffset,

    eyeY,

    r*.14,

    r*.19,

    0,

    0,
    Math.PI*2

  );


  ctx.fill();


  /* PUPILS */

  ctx.fillStyle="#10204a";


  ctx.beginPath();


  ctx.arc(

    x-eyeOffset+
    g.dir.x*r*.06,

    eyeY+
    g.dir.y*r*.06,

    r*.075,

    0,
    Math.PI*2

  );


  ctx.arc(

    x+eyeOffset+
    g.dir.x*r*.06,

    eyeY+
    g.dir.y*r*.06,

    r*.075,

    0,
    Math.PI*2

  );


  ctx.fill();


  ctx.restore();

}


/* =========================================
   RESIZE
========================================= */

function resizeCanvas(){

  if(
    !screens.game.classList.contains("active")
  ) return;


  const wrap =
    $("#boardWrap");


  const rect =
    wrap.getBoundingClientRect();


  const maxW =
    rect.width-8;


  const maxH =
    Math.max(
      80,
      rect.height-8
    );


  tile =
    Math.max(

      4,

      Math.floor(

        Math.min(
          maxW/W,
          maxH/H
        )

      )

    );


  const dpr =
    Math.min(
      devicePixelRatio||1,
      2
    );


  canvas.width =
    W*tile*dpr;


  canvas.height =
    H*tile*dpr;


  canvas.style.width =
    W*tile+"px";


  canvas.style.height =
    H*tile+"px";


  ctx.setTransform(

    dpr,
    0,
    0,
    dpr,
    0,
    0

  );


  ox=0;

  oy=0;

}


/* =========================================
   GAME LOOP
========================================= */

function loop(now){

  raf =
    requestAnimationFrame(loop);


  if(
    gameState!=="playing"
  ) return;


  let dt =
    Math.min(
      34,
      now-last
    );


  last=now;


  updatePlayer(dt);

  updateGhosts(dt);

  updateParticles(dt);

  draw();

}


/* =========================================
   CONTROLS
========================================= */

function requestDir(name){

  if(name==="stop"){

    player.next={
      x:0,
      y:0
    };

    player.dir={
      x:0,
      y:0
    };

    return;

  }


  const d =
    DIR[name];


  if(!d) return;


  player.next={
    x:d.x,
    y:d.y
  };


  if(
    gameState==="playing"
  ){

    beep(
      220,
      .018,
      "square",
      .008
    );

  }

}


/* =========================================
   SWIPE
========================================= */

let swipeStart=null;


canvas.addEventListener(

  "pointerdown",

  e=>{

    if(
      settings.controls==="dpad"
    ) return;


    swipeStart={

      x:e.clientX,

      y:e.clientY,

      id:e.pointerId

    };


    canvas.setPointerCapture?.(
      e.pointerId
    );


    e.preventDefault();

  },

  {passive:false}

);


canvas.addEventListener(

  "pointerup",

  e=>{

    if(
      !swipeStart ||
      settings.controls==="dpad"
    ) return;


    const dx =
      e.clientX-
      swipeStart.x;


    const dy =
      e.clientY-
      swipeStart.y;


    swipeStart=null;


    if(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      )<24
    ) return;


    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      requestDir(
        dx>0
        ?"right"
        :"left"
      );

    }

    else{

      requestDir(
        dy>0
        ?"down"
        :"up"
      );

    }


    e.preventDefault();

  },

  {passive:false}

);


/* =========================================
   DPAD
========================================= */

$$("[data-dir]")
.forEach(b=>{

  const fire=e=>{

    e.preventDefault();

    if(
      settings.controls!=="swipe"
    ){

      requestDir(
        b.dataset.dir
      );

    }

  };


  b.addEventListener(
    "pointerdown",
    fire,
    {passive:false}
  );


  b.addEventListener(
    "touchstart",
    fire,
    {passive:false}
  );


  b.addEventListener(
    "touchend",
    e=>e.preventDefault(),
    {passive:false}
  );

});


/* =========================================
   KEYBOARD
========================================= */

window.addEventListener(

  "keydown",

  e=>{

    const k =
      e.key.toLowerCase();


    const map={

      arrowup:"up",

      w:"up",

      arrowdown:"down",

      s:"down",

      arrowleft:"left",

      a:"left",

      arrowright:"right",

      d:"right"

    };


    if(map[k]){

      e.preventDefault();

      if(
        gameState==="playing"
      ){

        requestDir(
          map[k]
        );

      }

    }


    if(
      k==="p" ||
      k==="escape"
    ){

      e.preventDefault();


      if(
        gameState==="playing"
      ){

        pause();

      }

      else if(
        gameState==="paused"
      ){

        resume();

      }

    }

  }

);


/* =========================================
   TOUCH
========================================= */

document.addEventListener(

  "touchmove",

  e=>{

    if(
      screens.game.classList.contains("active")
    ){

      e.preventDefault();

    }

  },

  {passive:false}

);


/* =========================================
   FULLSCREEN
========================================= */

function fullscreen(){

  const el =
    document.documentElement;


  if(document.fullscreenElement){

    document.exitFullscreen?.();

  }

  else{

    el.requestFullscreen?.()
      .catch(
        ()=>toast(
          "Fullscreen is not available here"
        )
      );

  }

}

function bindDynamic(){

  $$("#infoPanel [data-action]")
  .forEach(b=>{

    b.onclick=()=>{

      if(
        b.dataset.action==="menu"
      ){

        show("menu");

        gameState="menu";

      }

    };

  });

}


/* =========================================
   SETTINGS
========================================= */

function refreshSettings(){

  $$("[data-setting]")
  .forEach(b=>{

    const v =
      b.dataset.value;


    b.classList.toggle(

      "on",

      String(
        settings[
          b.dataset.setting
        ]
      )===v

    );

  });

}


$$("[data-setting]")
.forEach(b=>{

  b.addEventListener(
    "click",
    ()=>{

      const k =
        b.dataset.setting;


      const v =
        b.dataset.value;


      settings[k] =
        v==="true"
        ? true
        : v==="false"
        ? false
        : v;


      saveSettings();

      refreshSettings();


      if(
        k==="fullscreen" &&
        settings.fullscreen
      ){

        fullscreen();

      }


      if(k==="controls"){

        toast(
          "Controls: "+
          settings.controls.toUpperCase()
        );

      }


      if(k==="vibration"){

        vibrate(20);

      }

    }
  );

});
