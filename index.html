<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030b">
<title>MAZE CHOMP — Neon Arcade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap');
:root{--bg:#05030b;--panel:#0b0817;--blue:#20a7ff;--purple:#9b45ff;--yellow:#ffe600;--text:#f6f2ff;--muted:#aaa0c8;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% 20%,#140b2c 0,#05030b 55%,#020207 100%);color:var(--text);font-family:Orbitron,system-ui,sans-serif;overflow:hidden}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.screen{width:100%;height:100%;display:none;align-items:center;justify-content:center;flex-direction:column;padding:18px;position:relative}
.screen.active{display:flex}
.bg-grid{position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#8e49ff22 1px,transparent 1px),linear-gradient(90deg,#8e49ff22 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,transparent,#000 15%,#000 80%,transparent)}
.logo{font-size:clamp(42px,9vw,88px);font-weight:900;letter-spacing:5px;text-align:center;color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--purple),0 0 48px var(--blue);margin:0 0 8px}
.subtitle{color:#bcb2d7;letter-spacing:4px;font-size:clamp(10px,2vw,15px);margin-bottom:32px;text-align:center}
.menu{width:min(460px,92vw);display:grid;gap:12px}
.neon-btn{min-height:54px;padding:13px 18px;border:1px solid #3caeff;border-radius:14px;background:linear-gradient(180deg,#17102a,#0a0714);box-shadow:inset 0 0 15px #742cff18,0 0 10px #168cff20;transition:.15s transform,.15s box-shadow,.15s background;letter-spacing:1.5px}
.neon-btn:hover{transform:translateY(-2px);box-shadow:0 0 18px #168cff66,0 0 30px #8c35ff22}
.neon-btn:active,.neon-btn.pressed{transform:scale(.96);box-shadow:0 0 25px #168cffaa}
.panel{width:min(620px,94vw);max-height:88vh;overflow:auto;background:#090614ee;border:1px solid #713eff99;border-radius:20px;padding:24px;box-shadow:0 0 40px #6d28d933;backdrop-filter:blur(12px)}
.panel h2{text-align:center;margin:0 0 18px;color:#fff;text-shadow:0 0 14px var(--purple)}
.panel p,.panel li{font-family:system-ui,sans-serif;line-height:1.6;color:#d0c8df}
.back{margin-top:16px;width:100%}
.setting-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.setting-row>label{align-self:center;color:#cfc6e2;font-size:13px;letter-spacing:1px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice.two{grid-template-columns:repeat(2,1fr)}
.choice button{min-height:44px;padding:8px;border-radius:10px;background:#100b1e;border:1px solid #3e3159;color:#aaa0c8;font-size:11px}
.choice button.on{color:#fff;border-color:#8c4cff;box-shadow:0 0 13px #8c4cff55;background:#221238}
#gameScreen{padding:0;justify-content:flex-start}
.game-shell{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;position:relative;padding:10px max(10px,env(safe-area-inset-left)) calc(8px + var(--safe)) max(10px,env(safe-area-inset-right));touch-action:none;user-select:none}
.hud{width:min(920px,96vw);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;flex:0 0 auto}
.hud-box{background:#090614d9;border:1px solid #5630a0;border-radius:10px;padding:7px 8px;text-align:center;box-shadow:0 0 14px #682dff20}
.hud-label{font-size:8px;color:#9287aa;letter-spacing:1.5px}.hud-value{font-size:clamp(12px,2.2vw,18px);font-weight:800;margin-top:3px}
.lives{letter-spacing:2px;color:#ff557f;text-shadow:0 0 9px #ff3d78}
.board-wrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;flex:1;width:100%;touch-action:none}
#gameCanvas{display:block;background:#03040a;border:2px solid #1654b6;border-radius:10px;box-shadow:0 0 18px #168cff66,0 0 55px #8a32ff2e;touch-action:none}
.top-controls{position:absolute;right:8px;top:8px;display:flex;gap:7px;z-index:5}
.small-btn{min-width:44px;min-height:44px;padding:8px 10px;border:1px solid #7546d8;border-radius:10px;background:#080610dd;box-shadow:0 0 12px #7e3fff33;font-size:11px}
.dpad{display:none;position:relative;width:min(190px,48vw);height:min(190px,48vw);margin-top:8px;flex:0 0 auto}
.dpad button{position:absolute;width:clamp(54px,15vw,68px);height:clamp(54px,15vw,68px);border:1px solid #20a7ff;border-radius:16px;background:linear-gradient(180deg,#171032,#080712);box-shadow:0 0 14px #20a7ff55,inset 0 0 18px #8c35ff22;font-size:25px;color:#fff}
.dpad button:active{transform:scale(.9);box-shadow:0 0 25px #20a7ffcc}
.up{left:50%;top:0;transform:translateX(-50%)}.down{left:50%;bottom:0;transform:translateX(-50%)}.left{left:0;top:50%;transform:translateY(-50%)}.right{right:0;top:50%;transform:translateY(-50%)}.center{left:50%;top:50%;transform:translate(-50%,-50%);border-color:#9b45ff!important;color:#9b45ff!important}
.rotate-hint{display:none;position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,90vw);padding:20px;text-align:center;border:1px solid #9b45ff;border-radius:18px;background:#080511ed;box-shadow:0 0 35px #9b45ff55;color:#fff;font-size:13px;line-height:1.7}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#03020acc;backdrop-filter:blur(5px);z-index:20}
.overlay.show{display:flex}.overlay-card{width:min(430px,88vw);text-align:center;background:#0a0614f5;border:1px solid #8048ff;border-radius:20px;padding:25px;box-shadow:0 0 45px #7d39ff55}
.overlay-card h2{margin:0 0 16px;font-size:clamp(24px,7vw,38px);text-shadow:0 0 16px #9b45ff}.overlay-card .neon-btn{width:100%;margin-top:9px}
#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;z-index:99;padding:9px 14px;border:1px solid #20a7ff;border-radius:20px;background:#080611ee;font-size:11px;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lowfx *{animation:none!important;filter:none!important}
@media (max-width:600px){
 .screen{padding:12px}.menu{gap:9px}.neon-btn{min-height:50px}
 .panel{padding:18px}.setting-row{grid-template-columns:1fr}.choice{grid-template-columns:repeat(3,1fr)}
 .hud{gap:4px;width:96vw}.hud-box{padding:5px 3px}.hud-label{font-size:7px}.hud-value{font-size:11px}
 .small-btn{min-width:44px;min-height:44px;font-size:9px}
}
@media (pointer:coarse){
 .dpad{display:block}
}
@media (max-height:620px) and (orientation:landscape){
 .game-shell{padding-top:5px}.hud{margin-bottom:3px}.hud-box{padding:3px}.dpad{display:none!important}.board-wrap{padding-right:5px}
}
@media (max-width:390px) and (orientation:portrait){
 .rotate-hint{display:block}
}
</style>
</head>
<body>
<div id="app" class="app">
<section id="menuScreen" class="screen active">
 <div class="bg-grid"></div><h1 class="logo">MAZE CHOMP</h1><div class="subtitle">NEON MAZE • CLASSIC ARCADE • MOBILE READY</div>
 <div class="menu">
  <button class="neon-btn" data-action="play">▶ PLAY GAME</button>
  <button class="neon-btn" data-action="how">📖 HOW TO PLAY</button>
  <button class="neon-btn" data-action="scores">🏆 HIGH SCORES</button>
  <button class="neon-btn" data-action="settings">⚙ SETTINGS</button>
  <button class="neon-btn" data-action="about">ℹ ABOUT</button>
 </div>
</section>

<section id="infoScreen" class="screen"><div class="panel" id="infoPanel"></div></section>
<section id="settingsScreen" class="screen"><div class="panel">
 <h2>⚙ SETTINGS</h2>
 <div class="setting-row"><label>CONTROLS</label><div class="choice"><button data-setting="controls" data-value="dpad">D-PAD</button><button data-setting="controls" data-value="swipe">SWIPE</button><button data-setting="controls" data-value="both">BOTH</button></div></div>
 <div class="setting-row"><label>DIFFICULTY</label><div class="choice"><button data-setting="difficulty" data-value="easy">EASY</button><button data-setting="difficulty" data-value="normal">NORMAL</button><button data-setting="difficulty" data-value="hard">HARD</button></div></div>
 <div class="setting-row"><label>SOUND</label><div class="choice two"><button data-setting="sound" data-value="true">ON</button><button data-setting="sound" data-value="false">OFF</button></div></div>
 <div class="setting-row"><label>MUSIC</label><div class="choice two"><button data-setting="music" data-value="true">ON</button><button data-setting="music" data-value="false">OFF</button></div></div>
 <div class="setting-row"><label>VIBRATION</label><div class="choice two"><button data-setting="vibration" data-value="true">ON</button><button data-setting="vibration" data-value="false">OFF</button></div></div>
 <div class="setting-row"><label>FULLSCREEN</label><div class="choice two"><button data-setting="fullscreen" data-value="true">ON</button><button data-setting="fullscreen" data-value="false">OFF</button></div></div>
 <button class="neon-btn back" data-action="menu">⌂ MAIN MENU</button>
</div></section>

<section id="gameScreen" class="screen">
 <div class="game-shell" id="gameShell">
  <div class="hud">
   <div class="hud-box"><div class="hud-label">SCORE</div><div id="score" class="hud-value">000000</div></div>
   <div class="hud-box"><div class="hud-label">HIGH SCORE</div><div id="highScore" class="hud-value">000000</div></div>
   <div class="hud-box"><div class="hud-label">LEVEL</div><div id="level" class="hud-value">1</div></div>
   <div class="hud-box"><div class="hud-label">LIVES</div><div id="lives" class="hud-value lives">♥ ♥ ♥</div></div>
  </div>
  <div class="board-wrap" id="boardWrap">
   <canvas id="gameCanvas"></canvas>
   <div class="top-controls"><button class="small-btn" data-action="pause">Ⅱ PAUSE</button><button class="small-btn" data-action="fullscreen">⛶ FULL</button></div>
   <div class="rotate-hint">↻ <b>Rotate your device for a better arcade experience</b><br>Portrait play is still available.</div>
  </div>
  <div class="dpad" id="dpad">
   <button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="center" aria-label="stop">●</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button>
  </div>
  <div class="overlay" id="pauseOverlay"><div class="overlay-card"><h2>GAME PAUSED</h2><button class="neon-btn" data-action="resume">▶ RESUME</button><button class="neon-btn" data-action="restart">↻ RESTART</button><button class="neon-btn" data-action="menu">⌂ MAIN MENU</button></div></div>
  <div class="overlay" id="messageOverlay"><div class="overlay-card" id="messageCard"></div></div>
 </div>
</section>
</div>
<div id="toast"></div>

<script>
"use strict";
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d",{alpha:false});
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const screens={menu:$("#menuScreen"),game:$("#gameScreen"),info:$("#infoScreen"),settings:$("#settingsScreen")};
const defaultSettings={controls:"both",difficulty:"normal",sound:true,music:false,vibration:true,fullscreen:false};
let settings=Object.assign({},defaultSettings,JSON.parse(localStorage.getItem("mazeChompSettings")||"{}"));
let highScore=Number(localStorage.getItem("mazeChompHighScore")||0);
let score=0,level=1,lives=3,dotsCollected=0,gameState="menu",raf=0,last=0,acc=0,lowFx=false;
let audioCtx=null,musicTimer=null;
const W=28,H=31;
const mazeRows=[
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#*####.#####.##.#####.####*#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"     #.#####.##.#####.#     ",
"     #.##..........##.#     ",
"     #.##.###..###.##.#     ",
"######.##.#      #.##.######",
"     #....#      #....#     ",
"######.##.#      #.##.######",
"     #.##.########.##.#     ",
"     #.##..........##.#     ",
"     #.#####.##.#####.#     ",
"######.#####.##.#####.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#*..##................##..*#",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#..........................#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#............##............#",
"############################"
];
const DIR={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const dirs=[DIR.up,DIR.left,DIR.down,DIR.right];
let tile=20,ox=0,oy=0;
let player,ghosts=[],dots=[],pellets=[],particles=[],powerTimer=0,combo=0;
const ghostColors=["#ff3d71","#20e6ff","#ff9e2c","#bd62ff"];

function saveSettings(){localStorage.setItem("mazeChompSettings",JSON.stringify(settings))}
function show(name){Object.values(screens).forEach(s=>s.classList.remove("active"));screens[name].classList.add("active");resizeCanvas()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1200)}
function vibrate(ms=20){if(settings.vibration&&navigator.vibrate)navigator.vibrate(ms)}
function beep(freq=440,dur=.05,type="square",vol=.025){
 if(!settings.sound)return;
 try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(e){}
}
function buttonFx(e){e.currentTarget.classList.add("pressed");setTimeout(()=>e.currentTarget.classList.remove("pressed"),120);vibrate(10)}
$$("button").forEach(b=>b.addEventListener("pointerdown",buttonFx));

function mazeAt(x,y){if(y<0||y>=H||x<0||x>=W)return " ";return mazeRows[y][x]||" "}
function isWall(x,y){const c=mazeAt(x,y);return c==="#"}
function canMove(x,y){return !isWall(Math.round(x),Math.round(y))}
function wrapX(x){if(x<0)return W-1;if(x>=W)return 0;return x}

function resetMap(){
 dots=[];pellets=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c=mazeAt(x,y);if(c===".")dots.push({x,y,alive:true});if(c==="*")pellets.push({x,y,alive:true})}
}
function newPlayer(){return {x:14,y:26,dir:{x:0,y:0},next:{x:0,y:0},speed:.115,mouth:0}}
function ghost(x,y,i){return {x,y,homeX:x,homeY:y,dir:dirs[i%4],type:i,mode:"chase",speed:.082+level*.004,fright:0,scatter:false,phase:Math.random()*3}}
function resetActors(){
 player=newPlayer();
 ghosts=[ghost(13,14,0),ghost(14,14,1),ghost(15,14,2),ghost(16,14,3)];
 ghosts.forEach((g,i)=>{g.color=ghostColors[i]});
 powerTimer=0;combo=0;
}
function startGame(){
 score=0;level=1;lives=3;dotsCollected=0;gameState="playing";resetMap();resetActors();show("game");hideOverlay();updateHud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);beep(330,.08);setTimeout(()=>beep(550,.1),100)
}
function restartLevel(){
 resetMap();resetActors();gameState="playing";hideOverlay();last=performance.now()
}
function addScore(n){score+=n;if(score>highScore){highScore=score;localStorage.setItem("mazeChompHighScore",highScore)}updateHud()}
function updateHud(){$("#score").textContent=String(score).padStart(6,"0");$("#highScore").textContent=String(highScore).padStart(6,"0");$("#level").textContent=level;$("#lives").textContent="♥ ".repeat(Math.max(0,lives)).trim()||"—"}
function moveEntity(e,dt){
 const sp=e.speed*(dt/16.666);
 const nx=e.x+e.dir.x*sp,ny=e.y+e.dir.y*sp;
 if(e.dir.x&&Math.abs(nx-Math.round(nx))<.13&&isWall(Math.round(nx+e.dir.x*.25),Math.round(e.y))) return false;
 if(e.dir.y&&Math.abs(ny-Math.round(ny))<.13&&isWall(Math.round(e.x),Math.round(ny+e.dir.y*.25))) return false;
 e.x=nx;e.y=ny;
 if(e===player)e.x=wrapX(e.x);
 return true;
}
function atCenter(e){return Math.abs(e.x-Math.round(e.x))<.08&&Math.abs(e.y-Math.round(e.y))<.08}
function tryTurn(){
 if(!player.next.x&&!player.next.y)return;
 const tx=Math.round(player.x)+player.next.x,ty=Math.round(player.y)+player.next.y;
 if(!isWall(tx,ty)){player.x=Math.round(player.x);player.y=Math.round(player.y);player.dir=player.next;player.next={x:0,y:0}}
}
function updatePlayer(dt){
 tryTurn(); const old={x:player.x,y:player.y}; moveEntity(player,dt);
 if(Math.abs(player.x-Math.round(player.x))<.06&&Math.abs(player.y-Math.round(player.y))<.06)tryTurn();
 player.mouth=(player.mouth+dt*.015)% (Math.PI*2);
 const cx=Math.round(player.x),cy=Math.round(player.y);
 for(const d of dots)if(d.alive&&d.x===cx&&d.y===cy){d.alive=false;dotsCollected++;addScore(10);beep(650,.025,"square",.012);spawn(cx,cy,3)}
 for(const p of pellets)if(p.alive&&p.x===cx&&p.y===cy){p.alive=false;dotsCollected++;addScore(50);powerTimer=7;combo=0;ghosts.forEach(g=>g.fright=7);beep(180,.15,"sawtooth",.035);vibrate(30);spawn(cx,cy,14)}
 if(!dots.some(d=>d.alive)&&!pellets.some(p=>p.alive)){levelComplete();return}
}
function chooseGhostDir(g){
 const x=Math.round(g.x),y=Math.round(g.y);
 let target;
 if(powerTimer>0){
   target={x:Math.round(player.x)+(Math.random()>.5?4:-4),y:Math.round(player.y)+(Math.random()>.5?4:-4)}
 } else if(g.type===0)target={x:Math.round(player.x),y:Math.round(player.y)};
 else if(g.type===1)target={x:Math.round(player.x)+player.dir.x*4,y:Math.round(player.y)+player.dir.y*4};
 else if(g.type===2){target={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}
 else {target=g.scatter?{x:g.homeX,y:g.homeY}:{x:Math.round(player.x)-player.dir.y*4,y:Math.round(player.y)+player.dir.x*4}}
 let options=dirs.filter(d=>!(d.x===-g.dir.x&&d.y===-g.dir.y)&&!isWall(x+d.x,y+d.y));
 if(!options.length)options=dirs.filter(d=>!isWall(x+d.x,y+d.y));
 options.sort((a,b)=>{
   const da=(x+a.x-target.x)**2+(y+a.y-target.y)**2,db=(x+b.x-target.x)**2+(y+b.y-target.y)**2;
   return powerTimer>0?db-da:da-db;
 });
 g.dir=options[Math.floor(Math.random()*Math.min(2,options.length))]||options[0];
}
function updateGhosts(dt){
 powerTimer=Math.max(0,powerTimer-dt/1000);
 ghosts.forEach(g=>{
   if(powerTimer<=0)g.fright=0; else g.fright=powerTimer;
   if(atCenter(g))chooseGhostDir(g);
   moveEntity(g,dt);
   const dx=g.x-player.x,dy=g.y-player.y;
   if(dx*dx+dy*dy<.42){
     if(g.fright>0){const vals=[200,400,800,1600],v=vals[Math.min(combo,3)];addScore(v);combo++;g.x=g.homeX;g.y=g.homeY;g.fright=0;beep(880,.12,"square",.04);vibrate(35);spawn(player.x,player.y,18)}
     else playerHit()
   }
   g.phase+=dt/1000;
   g.scatter=Math.floor(g.phase/6)%2===1;
 })
}
function playerHit(){
 if(gameState!=="playing")return; lives--;updateHud();vibrate(100);beep(90,.22,"sawtooth",.045);spawn(player.x,player.y,20);
 if(lives<=0){gameOver();return}
 player.x=14;player.y=26;player.dir={x:0,y:0};player.next={x:0,y:0};
 ghosts.forEach((g,i)=>{g.x=g.homeX;g.y=g.homeY;g.dir=dirs[i%4]})
}
function levelComplete(){
 gameState="level";addScore(500+level*100);beep(700,.12);setTimeout(()=>beep(950,.15),130);vibrate(60);
 showMessage("LEVEL COMPLETE",`BONUS +${500+level*100}<br><small>Get ready for Level ${level+1}</small>`,[{t:"▶ NEXT LEVEL",fn:()=>{level++;restartLevel()}}])
}
function gameOver(){
 gameState="over";localStorage.setItem("mazeChompHighScore",highScore);
 showMessage("GAME OVER",`FINAL SCORE <b>${String(score).padStart(6,"0")}</b><br>HIGH SCORE <b>${String(highScore).padStart(6,"0")}</b><br>LEVEL REACHED <b>${level}</b><br>DOTS COLLECTED <b>${dotsCollected}</b>`,[{t:"↻ PLAY AGAIN",fn:startGame},{t:"⌂ MAIN MENU",fn:()=>{hideOverlay();show("menu")}}])
}
function showMessage(title,body,buttons){
 const c=$("#messageCard");c.innerHTML=`<h2>${title}</h2><div style="line-height:2;color:#d8d0e8;font-size:13px">${body}</div>`;
 buttons.forEach(b=>{const x=document.createElement("button");x.className="neon-btn";x.textContent=b.t;x.onclick=b.fn;c.appendChild(x)});
 $("#messageOverlay").classList.add("show")
}
function hideOverlay(){$("#messageOverlay").classList.remove("show");$("#pauseOverlay").classList.remove("show")}
function pause(){if(gameState==="playing"){gameState="paused";$("#pauseOverlay").classList.add("show")}}
function resume(){if(gameState==="paused"){gameState="playing";$("#pauseOverlay").classList.remove("show");last=performance.now()}}
function spawn(x,y,n){if(lowFx&&n>7)n=7;for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,life:.4+Math.random()*.6})}
function updateParticles(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt/1000});particles=particles.filter(p=>p.life>0)}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();ctx.translate(ox,oy);
 const glow=!lowFx;
 // maze
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isWall(x,y)){
   ctx.fillStyle="#06122a";ctx.fillRect(x*tile,y*tile,tile,tile);
   ctx.strokeStyle=glow?"#159cff":"#1473c2";ctx.lineWidth=Math.max(1,tile*.075);
   ctx.shadowBlur=glow?tile*.45:0;ctx.shadowColor="#20a7ff";
   // only draw exposed edges
   if(!isWall(x,y-1)){ctx.beginPath();ctx.moveTo(x*tile,y*tile+.5);ctx.lineTo((x+1)*tile,y*tile+.5);ctx.stroke()}
   if(!isWall(x+1,y)){ctx.beginPath();ctx.moveTo((x+1)*tile,y*tile);ctx.lineTo((x+1)*tile,(y+1)*tile);ctx.stroke()}
   if(!isWall(x,y+1)){ctx.beginPath();ctx.moveTo(x*tile,(y+1)*tile-.5);ctx.lineTo((x+1)*tile,(y+1)*tile-.5);ctx.stroke()}
   if(!isWall(x-1,y)){ctx.beginPath();ctx.moveTo(x*tile,y*tile);ctx.lineTo(x*tile,(y+1)*tile);ctx.stroke()}
 }
 ctx.shadowBlur=0;
 dots.forEach(d=>{if(d.alive){ctx.fillStyle="#d9ecff";ctx.shadowBlur=glow?7:0;ctx.shadowColor="#8ed5ff";ctx.beginPath();ctx.arc((d.x+.5)*tile,(d.y+.5)*tile,tile*.10,0,7);ctx.fill()}});
 pellets.forEach(p=>{if(p.alive){const pulse=1+Math.sin(performance.now()/130)*.18;ctx.fillStyle="#fff";ctx.shadowBlur=glow?18:0;ctx.shadowColor="#fff";ctx.beginPath();ctx.arc((p.x+.5)*tile,(p.y+.5)*tile,tile*.25*pulse,0,7);ctx.fill()}});
 ghosts.forEach(drawGhost);
 drawPlayer();
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#fff";ctx.shadowBlur=8;ctx.shadowColor="#9b45ff";ctx.beginPath();ctx.arc(p.x*tile,p.y*tile,tile*.08,0,7);ctx.fill()});ctx.globalAlpha=1;ctx.shadowBlur=0;
 ctx.restore();
}
function drawPlayer(){
 const px=player.x*tile+tile/2,py=player.y*tile+tile/2,r=tile*.42;
 let ang=0;if(player.dir.x===1)ang=0;if(player.dir.x===-1)ang=Math.PI;if(player.dir.y===1)ang=Math.PI/2;if(player.dir.y===-1)ang=-Math.PI/2;
 const mouth=(.16+Math.abs(Math.sin(player.mouth))*.22)*Math.PI;
 ctx.fillStyle="#ffe600";ctx.shadowBlur=lowFx?0:16;ctx.shadowColor="#ffe600";ctx.beginPath();ctx.moveTo(px,py);ctx.arc(px,py,r,ang+mouth,ang+Math.PI*2-mouth);ctx.closePath();ctx.fill();ctx.shadowBlur=0
}
function drawGhost(g){
 const x=g.x*tile+tile/2,y=g.y*tile+tile/2,r=tile*.4;
 let col=g.fright>0?(Math.floor(performance.now()/180)%2?"#e9f7ff":"#2d69ff"):g.color;
 ctx.fillStyle=col;ctx.shadowBlur=lowFx?0:13;ctx.shadowColor=col;
 ctx.beginPath();ctx.arc(x,y-r*.05,r,Math.PI,0);ctx.lineTo(x+r,y+r*.75);ctx.lineTo(x+r*.55,y+r*.48);ctx.lineTo(x+r*.1,y+r*.75);ctx.lineTo(x-r*.35,y+r*.48);ctx.lineTo(x-r,y+r*.75);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
 const ex=x+r*.34,ey=y-r*.15;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x-r*.18,ey,r*.14,0,7);ctx.arc(ex,ey,r*.14,0,7);ctx.fill();ctx.fillStyle="#10204a";ctx.beginPath();ctx.arc(x-r*.18+g.dir.x*r*.06,ey+g.dir.y*r*.06,r*.07,0,7);ctx.arc(ex+g.dir.x*r*.06,ey+g.dir.y*r*.06,r*.07,0,7);ctx.fill()
}
function resizeCanvas(){
 if(!screens.game.classList.contains("active"))return;
 const wrap=$("#boardWrap"), rect=wrap.getBoundingClientRect();
 const maxW=rect.width-8,maxH=Math.max(80,rect.height-8);
 tile=Math.max(4,Math.floor(Math.min(maxW/W,maxH/H)));
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=W*tile*dpr;canvas.height=H*tile*dpr;canvas.style.width=(W*tile)+"px";canvas.style.height=(H*tile)+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);ox=0;oy=0;
 // canvas backing is DPR scaled; game drawing uses CSS pixels after transform
}
function loop(now){
 raf=requestAnimationFrame(loop);
 if(gameState!=="playing")return;
 let dt=Math.min(34,now-last);last=now;
 updatePlayer(dt);updateGhosts(dt);updateParticles(dt);draw();
}
function requestDir(name){
 const d=DIR[name];if(!d)return;player.next={x:d.x,y:d.y};
 if(gameState==="playing")beep(220,.018,"square",.008)
}
let swipeStart=null;
canvas.addEventListener("pointerdown",e=>{if(settings.controls==="dpad")return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});
canvas.addEventListener("pointerup",e=>{if(!swipeStart||settings.controls==="dpad")return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))requestDir(dx>0?"right":"left");else requestDir(dy>0?"down":"up");e.preventDefault()},{passive:false});
$$("[data-dir]").forEach(b=>{
 const fire=e=>{e.preventDefault();if(settings.controls!=="swipe")requestDir(b.dataset.dir)};
 b.addEventListener("pointerdown",fire,{passive:false});b.addEventListener("touchstart",fire,{passive:false});
 b.addEventListener("touchend",e=>e.preventDefault(),{passive:false});
});
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 const map={arrowup:"up",w:"up",arrowdown:"down",s:"down",arrowleft:"left",a:"left",arrowright:"right",d:"right"};
 if(map[k]){e.preventDefault();if(gameState==="playing")requestDir(map[k])}
 if(k==="p"||k==="escape"){e.preventDefault();gameState==="playing"?pause():gameState==="paused"&&resume()}
});
document.addEventListener("touchmove",e=>{if(screens.game.classList.contains("active"))e.preventDefault()},{passive:false});
window.addEventListener("resize",resizeCanvas);window.addEventListener("orientationchange",()=>setTimeout(resizeCanvas,120));
document.addEventListener("fullscreenchange",()=>setTimeout(resizeCanvas,120));

function fullscreen(){
 const el=document.documentElement;
 if(document.fullscreenElement){document.exitFullscreen?.()}else{el.requestFullscreen?.().catch(()=>toast("Fullscreen is not available here"))}
}
function bindActions(){
 $$("[data-action]").forEach(b=>b.addEventListener("click",()=>{
   const a=b.dataset.action;
   if(a==="play")startGame();
   if(a==="how"){$("#infoPanel").innerHTML=`<h2>📖 HOW TO PLAY</h2><p>Eat every dot and power pellet. Use <b>Arrow Keys / WASD</b>, the virtual D-pad, or swipe.</p><ul><li>Dot = +10</li><li>Power Pellet = +50</li><li>Ghosts = 200 → 400 → 800 → 1600</li><li>Power pellets make ghosts vulnerable.</li><li>Clear the maze to advance to the next level.</li><li>You have 3 lives. Difficulty rises each level.</li></ul><p><b>Mobile:</b> choose D-pad, Swipe, or Both in Settings. The game prevents page scrolling while you play.</p><button class="neon-btn back" data-action="menu">⌂ MAIN MENU</button>`;show("info");bindDynamic()}
   if(a==="scores"){const hs=JSON.parse(localStorage.getItem("mazeChompScores")||"[]");$("#infoPanel").innerHTML=`<h2>🏆 HIGH SCORES</h2><p style="text-align:center;font-size:28px;color:#ffe600;text-shadow:0 0 14px #ffe600">${String(highScore).padStart(6,"0")}</p><p style="text-align:center">Your best score on this device.</p><button class="neon-btn back" data-action="menu">⌂ MAIN MENU</button>`;show("info");bindDynamic()}
   if(a==="settings"){refreshSettings();show("settings")}
   if(a==="about"){$("#infoPanel").innerHTML=`<h2>ℹ ABOUT MAZE CHOMP</h2><p>MAZE CHOMP is a lightweight HTML5 Canvas arcade game designed for phones, tablets, laptops and desktop browsers.</p><p>It uses responsive Canvas scaling, touch/pointer controls, swipe input, keyboard input, LocalStorage settings/high score, Web Audio sound effects, optional vibration and fullscreen where the browser permits it.</p><button class="neon-btn back" data-action="menu">⌂ MAIN MENU</button>`;show("info");bindDynamic()}
   if(a==="menu"){hideOverlay();show("menu");gameState="menu"}
   if(a==="pause")pause();if(a==="resume")resume();if(a==="restart")startGame();if(a==="fullscreen")fullscreen()
 }))
}
function bindDynamic(){$$("#infoPanel [data-action]").forEach(b=>b.onclick=()=>{if(b.dataset.action==="menu"){show("menu");gameState="menu"}})}
function refreshSettings(){
 $$("[data-setting]").forEach(b=>{const v=b.dataset.value; b.classList.toggle("on",String(settings[b.dataset.setting])===v)})
}
$$("[data-setting]").forEach(b=>b.addEventListener("click",()=>{
 const k=b.dataset.setting,v=b.dataset.value;settings[k]=(v==="true"?true:v==="false"?false:v);saveSettings();refreshSettings();
 if(k==="fullscreen"&&settings.fullscreen)fullscreen(); if(k==="controls")toast("Controls: "+settings.controls.toUpperCase());if(k==="vibration")vibrate(20)
}));
bindActions();refreshSettings();updateHud();
setInterval(()=>{if(!lowFx&&performance.now()>5000){/* effects are intentionally lightweight */}},1000);
</script>
</body>
