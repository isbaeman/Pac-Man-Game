<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030b">
<title>MAZE CHOMP — Neon Arcade</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap');

:root{
  --bg:#05030b;
  --panel:#0b0817;
  --blue:#20a7ff;
  --purple:#9b45ff;
  --yellow:#ffe600;
  --text:#f6f2ff;
  --muted:#aaa0c8;
  --safe:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 50% 20%,#140b2c 0,#05030b 55%,#020207 100%);
  color:var(--text);
  font-family:Orbitron,system-ui,sans-serif;
  overflow:hidden;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.screen{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:18px;
  position:relative;
}

.screen.active{
  display:flex;
}

.bg-grid{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(#8e49ff22 1px,transparent 1px),
    linear-gradient(90deg,#8e49ff22 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(
    to bottom,
    transparent,
    #000 15%,
    #000 80%,
    transparent
  );
}

.logo{
  font-size:clamp(42px,9vw,88px);
  font-weight:900;
  letter-spacing:5px;
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 8px #fff,
    0 0 22px var(--purple),
    0 0 48px var(--blue);
  margin:0 0 8px;
  animation:logoPulse 2.5s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    text-shadow:
      0 0 8px #fff,
      0 0 22px var(--purple),
      0 0 48px var(--blue);
  }
  50%{
    text-shadow:
      0 0 12px #fff,
      0 0 32px var(--purple),
      0 0 65px var(--blue);
  }
}

.subtitle{
  color:#bcb2d7;
  letter-spacing:4px;
  font-size:clamp(10px,2vw,15px);
  margin-bottom:32px;
  text-align:center;
}

.menu{
  width:min(460px,92vw);
  display:grid;
  gap:12px;
}

.neon-btn{
  min-height:54px;
  padding:13px 18px;
  border:1px solid #3caeff;
  border-radius:14px;
  background:linear-gradient(180deg,#17102a,#0a0714);
  box-shadow:
    inset 0 0 15px #742cff18,
    0 0 10px #168cff20;
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;
  letter-spacing:1.5px;
}

.neon-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 18px #168cff66,
    0 0 30px #8c35ff22;
}

.neon-btn:active,
.neon-btn.pressed{
  transform:scale(.96);
  box-shadow:0 0 25px #168cffaa;
}

.panel{
  width:min(620px,94vw);
  max-height:88vh;
  overflow:auto;
  background:#090614ee;
  border:1px solid #713eff99;
  border-radius:20px;
  padding:24px;
  box-shadow:0 0 40px #6d28d933;
  backdrop-filter:blur(12px);
}

.panel h2{
  text-align:center;
  margin:0 0 18px;
  color:#fff;
  text-shadow:0 0 14px var(--purple);
}

.panel p,
.panel li{
  font-family:system-ui,sans-serif;
  line-height:1.6;
  color:#d0c8df;
}

.back{
  margin-top:16px;
  width:100%;
}

.setting-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 0;
}

.setting-row>label{
  align-self:center;
  color:#cfc6e2;
  font-size:13px;
  letter-spacing:1px;
}

.choice{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.choice.two{
  grid-template-columns:repeat(2,1fr);
}

.choice button{
  min-height:44px;
  padding:8px;
  border-radius:10px;
  background:#100b1e;
  border:1px solid #3e3159;
  color:#aaa0c8;
  font-size:11px;
}

.choice button.on{
  color:#fff;
  border-color:#8c4cff;
  box-shadow:0 0 13px #8c4cff55;
  background:#221238;
}

/* GAME */

#gameScreen{
  padding:0;
  justify-content:flex-start;
}

.game-shell{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding:
    10px
    max(10px,env(safe-area-inset-left))
    calc(8px + var(--safe))
    max(10px,env(safe-area-inset-right));
  touch-action:none;
  user-select:none;
}

.hud{
  width:min(920px,96vw);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:8px;
  flex:0 0 auto;
}

.hud-box{
  background:#090614d9;
  border:1px solid #5630a0;
  border-radius:10px;
  padding:7px 8px;
  text-align:center;
  box-shadow:0 0 14px #682dff20;
}

.hud-label{
  font-size:8px;
  color:#9287aa;
  letter-spacing:1.5px;
}

.hud-value{
  font-size:clamp(12px,2.2vw,18px);
  font-weight:800;
  margin-top:3px;
}

.lives{
  letter-spacing:2px;
  color:#ff557f;
  text-shadow:0 0 9px #ff3d78;
}

.board-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
  flex:1;
  width:100%;
  touch-action:none;
}

#gameCanvas{
  display:block;
  background:#03040a;
  border:2px solid #1654b6;
  border-radius:10px;
  box-shadow:
    0 0 18px #168cff66,
    0 0 55px #8a32ff2e;
  touch-action:none;
}

.top-controls{
  position:absolute;
  right:8px;
  top:8px;
  display:flex;
  gap:7px;
  z-index:5;
}

.small-btn{
  min-width:44px;
  min-height:44px;
  padding:8px 10px;
  border:1px solid #7546d8;
  border-radius:10px;
  background:#080610dd;
  box-shadow:0 0 12px #7e3fff33;
  font-size:11px;
}

.dpad{
  display:none;
  position:relative;
  width:min(190px,48vw);
  height:min(190px,48vw);
  margin-top:8px;
  flex:0 0 auto;
}

.dpad button{
  position:absolute;
  width:clamp(54px,15vw,68px);
  height:clamp(54px,15vw,68px);
  border:1px solid #20a7ff;
  border-radius:16px;
  background:linear-gradient(180deg,#171032,#080712);
  box-shadow:
    0 0 14px #20a7ff55,
    inset 0 0 18px #8c35ff22;
  font-size:25px;
  color:#fff;
  transition:
    transform .08s ease,
    box-shadow .08s ease;
}

.dpad button:active{
  transform:scale(.9);
  box-shadow:0 0 25px #20a7ffcc;
}

.up{
  left:50%;
  top:0;
  transform:translateX(-50%);
}

.down{
  left:50%;
  bottom:0;
  transform:translateX(-50%);
}

.left{
  left:0;
  top:50%;
  transform:translateY(-50%);
}

.right{
  right:0;
  top:50%;
  transform:translateY(-50%);
}

.center{
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-color:#9b45ff!important;
  color:#9b45ff!important;
}

.rotate-hint{
  display:none;
  position:absolute;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(420px,90vw);
  padding:20px;
  text-align:center;
  border:1px solid #9b45ff;
  border-radius:18px;
  background:#080511ed;
  box-shadow:0 0 35px #9b45ff55;
  color:#fff;
  font-size:13px;
  line-height:1.7;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#03020acc;
  backdrop-filter:blur(5px);
  z-index:20;
}

.overlay.show{
  display:flex;
}

.overlay-card{
  width:min(430px,88vw);
  text-align:center;
  background:#0a0614f5;
  border:1px solid #8048ff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 45px #7d39ff55;
}

.overlay-card h2{
  margin:0 0 16px;
  font-size:clamp(24px,7vw,38px);
  text-shadow:0 0 16px #9b45ff;
}

.overlay-card .neon-btn{
  width:100%;
  margin-top:9px;
}

#toast{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%) translateY(-15px);
  opacity:0;
  z-index:99;
  padding:9px 14px;
  border:1px solid #20a7ff;
  border-radius:20px;
  background:#080611ee;
  font-size:11px;
  transition:.25s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.lowfx *{
  animation:none!important;
  filter:none!important;
}

@media(max-width:600px){

  .screen{
    padding:12px;
  }

  .menu{
    gap:9px;
  }

  .neon-btn{
    min-height:50px;
  }

  .panel{
    padding:18px;
  }

  .setting-row{
    grid-template-columns:1fr;
  }

  .choice{
    grid-template-columns:repeat(3,1fr);
  }

  .hud{
    gap:4px;
    width:96vw;
  }

  .hud-box{
    padding:5px 3px;
  }

  .hud-label{
    font-size:7px;
  }

  .hud-value{
    font-size:11px;
  }

  .small-btn{
    min-width:44px;
    min-height:44px;
    font-size:9px;
  }
}

@media(pointer:coarse){
  .dpad{
    display:block;
  }
}

@media(max-height:620px) and (orientation:landscape){

  .game-shell{
    padding-top:5px;
  }

  .hud{
    margin-bottom:3px;
  }

  .hud-box{
    padding:3px;
  }

  .dpad{
    display:none!important;
  }

  .board-wrap{
    padding-right:5px;
  }
}

@media(max-width:390px) and (orientation:portrait){

  .rotate-hint{
    display:block;
  }
}
</style>
</head>

<body>

<div id="app" class="app">

  <!-- MENU -->
  <section id="menuScreen" class="screen active">

    <div class="bg-grid"></div>

    <h1 class="logo">MAZE CHOMP</h1>

    <div class="subtitle">
      NEON MAZE • CLASSIC ARCADE • MOBILE READY
    </div>

    <div class="menu">

      <button class="neon-btn" data-action="play">
        ▶ PLAY GAME
      </button>

      <button class="neon-btn" data-action="how">
        📖 HOW TO PLAY
      </button>

      <button class="neon-btn" data-action="scores">
        🏆 HIGH SCORES
      </button>

      <button class="neon-btn" data-action="settings">
        ⚙ SETTINGS
      </button>

      <button class="neon-btn" data-action="about">
        ℹ ABOUT
      </button>

    </div>
  </section>


  <!-- INFO -->
  <section id="infoScreen" class="screen">

    <div class="panel" id="infoPanel"></div>

  </section>


  <!-- SETTINGS -->
  <section id="settingsScreen" class="screen">

    <div class="panel">

      <h2>⚙ SETTINGS</h2>

      <div class="setting-row">
        <label>CONTROLS</label>

        <div class="choice">
          <button data-setting="controls" data-value="dpad">D-PAD</button>
          <button data-setting="controls" data-value="swipe">SWIPE</button>
          <button data-setting="controls" data-value="both">BOTH</button>
        </div>
      </div>

      <div class="setting-row">
        <label>DIFFICULTY</label>

        <div class="choice">
          <button data-setting="difficulty" data-value="easy">EASY</button>
          <button data-setting="difficulty" data-value="normal">NORMAL</button>
          <button data-setting="difficulty" data-value="hard">HARD</button>
        </div>
      </div>

      <div class="setting-row">
        <label>SOUND</label>

        <div class="choice two">
          <button data-setting="sound" data-value="true">ON</button>
          <button data-setting="sound" data-value="false">OFF</button>
        </div>
      </div>

      <div class="setting-row">
        <label>MUSIC</label>

        <div class="choice two">
          <button data-setting="music" data-value="true">ON</button>
          <button data-setting="music" data-value="false">OFF</button>
        </div>
      </div>

      <div class="setting-row">
        <label>VIBRATION</label>

        <div class="choice two">
          <button data-setting="vibration" data-value="true">ON</button>
          <button data-setting="vibration" data-value="false">OFF</button>
        </div>
      </div>

      <div class="setting-row">
        <label>FULLSCREEN</label>

        <div class="choice two">
          <button data-setting="fullscreen" data-value="true">ON</button>
          <button data-setting="fullscreen" data-value="false">OFF</button>
        </div>
      </div>

      <button class="neon-btn back" data-action="menu">
        ⌂ MAIN MENU
      </button>

    </div>
  </section>


  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="game-shell" id="gameShell">

      <div class="hud">

        <div class="hud-box">
          <div class="hud-label">SCORE</div>
          <div id="score" class="hud-value">000000</div>
        </div>

        <div class="hud-box">
          <div class="hud-label">HIGH SCORE</div>
          <div id="highScore" class="hud-value">000000</div>
        </div>

        <div class="hud-box">
          <div class="hud-label">LEVEL</div>
          <div id="level" class="hud-value">1</div>
        </div>

        <div class="hud-box">
          <div class="hud-label">LIVES</div>
          <div id="lives" class="hud-value lives">♥ ♥ ♥</div>
        </div>

      </div>


      <div class="board-wrap" id="boardWrap">

        <canvas id="gameCanvas"></canvas>

        <div class="top-controls">

          <button class="small-btn" data-action="pause">
            Ⅱ PAUSE
          </button>

          <button class="small-btn" data-action="fullscreen">
            ⛶ FULL
          </button>

        </div>

        <div class="rotate-hint">
          ↻
          <b>Rotate your device for a better arcade experience</b>
          <br>
          Portrait play is still available.
        </div>

      </div>


      <!-- D-PAD -->
      <div class="dpad" id="dpad">

        <button class="up" data-dir="up">▲</button>

        <button class="left" data-dir="left">◀</button>

        <button class="center" aria-label="stop">●</button>

        <button class="right" data-dir="right">▶</button>

        <button class="down" data-dir="down">▼</button>

      </div>


      <!-- PAUSE -->
      <div class="overlay" id="pauseOverlay">

        <div class="overlay-card">

          <h2>GAME PAUSED</h2>

          <button class="neon-btn" data-action="resume">
            ▶ RESUME
          </button>

          <button class="neon-btn" data-action="restart">
            ↻ RESTART
          </button>

          <button class="neon-btn" data-action="menu">
            ⌂ MAIN MENU
          </button>

        </div>

      </div>


      <!-- MESSAGE -->
      <div class="overlay" id="messageOverlay">

        <div class="overlay-card" id="messageCard"></div>

      </div>

    </div>

  </section>

</div>

<div id="toast"></div>


<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d", { alpha:false });

const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];

const screens = {
  menu: $("#menuScreen"),
  game: $("#gameScreen"),
  info: $("#infoScreen"),
  settings: $("#settingsScreen")
};


/* =========================================================
   SETTINGS
========================================================= */

const defaultSettings = {
  controls:"both",
  difficulty:"normal",
  sound:true,
  music:false,
  vibration:true,
  fullscreen:false
};

let savedSettings = {};

try{
  savedSettings =
    JSON.parse(localStorage.getItem("mazeChompSettings") || "{}");
}catch(e){
  savedSettings = {};
}

let settings = Object.assign({},defaultSettings,savedSettings);

let highScore =
  Number(localStorage.getItem("mazeChompHighScore") || 0);


/* =========================================================
   GAME VARIABLES
========================================================= */

let score = 0;
let level = 1;
let lives = 3;
let dotsCollected = 0;

let gameState = "menu";

let raf = 0;
let last = 0;

let lowFx = false;

let audioCtx = null;

const W = 28;
const H = 31;


/* =========================================================
   MAZE
========================================================= */

const mazeRows = [

"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#*####.#####.##.#####.####*#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"     #.#####.##.#####.#     ",
"     #.##..........##.#     ",
"     #.##.###..###.##.#     ",
"######.##.#      #.##.######",
"     #....#      #....#     ",
"######.##.#      #.##.######",
"     #.##.########.##.#     ",
"     #.##..........##.#     ",
"     #.#####.##.#####.#     ",
"######.#####.##.#####.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#*..##................##..*#",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#..........................#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#............##............#",
"############################"

];


/* =========================================================
   DIRECTIONS
========================================================= */

const DIR = {

  up:{
    x:0,
    y:-1
  },

  down:{
    x:0,
    y:1
  },

  left:{
    x:-1,
    y:0
  },

  right:{
    x:1,
    y:0
  }

};

const dirs = [
  DIR.up,
  DIR.left,
  DIR.down,
  DIR.right
];


/* =========================================================
   GAME OBJECTS
========================================================= */

let tile = 20;
let ox = 0;
let oy = 0;

let player;
let ghosts = [];

let dots = [];
let pellets = [];

let particles = [];

let powerTimer = 0;
let combo = 0;


/* =========================================================
   UTILITY
========================================================= */

function saveSettings(){

  localStorage.setItem(
    "mazeChompSettings",
    JSON.stringify(settings)
  );

}


function show(name){

  Object.values(screens).forEach(
    screen => screen.classList.remove("active")
  );

  screens[name].classList.add("active");

  requestAnimationFrame(resizeCanvas);

}


function toast(message){

  const element = $("#toast");

  element.textContent = message;

  element.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(
    () => element.classList.remove("show"),
    1200
  );

}


function vibrate(ms=20){

  if(
    settings.vibration &&
    navigator.vibrate
  ){
    navigator.vibrate(ms);
  }

}


/* =========================================================
   AUDIO
========================================================= */

function beep(
  freq=440,
  dur=.05,
  type="square",
  vol=.025
){

  if(!settings.sound) return;

  try{

    if(!audioCtx){

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

    const oscillator =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    oscillator.type = type;

    oscillator.frequency.value = freq;

    gain.gain.value = vol;

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime + dur
    );

    oscillator.stop(
      audioCtx.currentTime + dur
    );

  }catch(e){}

}


/* =========================================================
   BUTTON FX
========================================================= */

function buttonFx(event){

  const button = event.currentTarget;

  button.classList.add("pressed");

  setTimeout(
    () => button.classList.remove("pressed"),
    120
  );

  vibrate(10);

}

$$("button").forEach(
  button =>
    button.addEventListener(
      "pointerdown",
      buttonFx
    )
);


/* =========================================================
   MAZE HELPERS
========================================================= */

function mazeAt(x,y){

  if(y < 0 || y >= H || x < 0 || x >= W){
    return " ";
  }

  return mazeRows[y][x] || " ";

}


function isWall(x,y){

  return mazeAt(x,y) === "#";

}


function wrapX(x){

  if(x < -0.5){
    return W - 0.5;
  }

  if(x > W - 0.5){
    return -0.5;
  }

  return x;

}


function canMoveTile(x,y){

  return !isWall(x,y);

}


/* =========================================================
   MAP
========================================================= */

function resetMap(){

  dots = [];
  pellets = [];

  for(let y=0;y<H;y++){

    for(let x=0;x<W;x++){

      const c = mazeAt(x,y);

      if(c === "."){

        dots.push({
          x,
          y,
          alive:true
        });

      }

      if(c === "*"){

        pellets.push({
          x,
          y,
          alive:true
        });

      }

    }

  }

}

   PLAYER

    },

}


/* =========================================================
   GHOST
========================================================= */

function createGhost(x,y,i){

  return {

    x:x + .5,
    y:y + .5,

    homeX:x + .5,
    homeY:y + .5,

    dir:dirs[i % 4],

    type:i,

    speed:.0048 + level*.00025,

    fright:0,

    scatter:false,

    phase:i * 1.2

  };

}


const ghostColors = [
  "#ff3d71",
  "#20e6ff",
  "#ff9e2c",
  "#bd62ff"
];


/* =========================================================
   ACTORS
========================================================= */

function resetActors(){

function addScore(amount){

/* =========================================================
   COLLISION HELPERS
========================================================= */

function isOpen(x,y){

  return !isWall(
    Math.round(x),
    Math.round(y)
  );

}


function centered(entity){

  const cx = Math.floor(entity.x) + .5;
  const cy = Math.floor(entity.y) + .5;

  return (
    Math.abs(entity.x-cx) < .075 &&
    Math.abs(entity.y-cy) < .075
  );

}


function snapToCenter(entity){

  entity.x =
    Math.floor(entity.x) + .5;

  entity.y =
    Math.floor(entity.y) + .5;

}


/* =========================================================
   MOVEMENT
========================================================= */

function canTravel(entity,dir){

  if(!dir.x && !dir.y){
    return true;
  }

  const cx =
    Math.floor(entity.x) + .5;

  const cy =
    Math.floor(entity.y) + .5;

  const tx =
    Math.floor(cx + dir.x);

  const ty =
    Math.floor(cy + dir.y);

  return !isWall(tx,ty);

}


function moveEntity(entity,dt){

  if(!entity.dir.x && !entity.dir.y){
    return;
  }

  const amount =
    entity.speed * dt;

  let nx =
    entity.x + entity.dir.x * amount;

  let ny =
    entity.y + entity.dir.y * amount;


  /* horizontal */

  if(entity.dir.x !== 0){

    const nextTile =
      entity.dir.x > 0
        ? Math.floor(nx + .48)
        : Math.floor(nx - .48);

    const row =
      Math.floor(entity.y);

    if(isWall(nextTile,row)){

      snapToCenter(entity);

      return;

    }

    entity.x = nx;

  }


  /* vertical */

  if(entity.dir.y !== 0){

    const nextTile =
      entity.dir.y > 0
        ? Math.floor(ny + .48)
        : Math.floor(ny - .48);

    const column =
      Math.floor(entity.x);

    if(isWall(column,nextTile)){

      snapToCenter(entity);

      return;

    }

    entity.y = ny;

  }


  /* tunnel */

  if(entity === player){

    entity.x = wrapX(entity.x);

  }

}


/* =========================================================
   PLAYER TURN
========================================================= */

function tryPlayerTurn(){

  if(
    !player.next.x &&
    !player.next.y
  ){
    return;
  }

  if(canTravel(player,player.next)){

    if(
      Math.abs(player.x - (Math.floor(player.x)+.5)) < .22 &&
      Math.abs(player.y - (Math.floor(player.y)+.5)) < .22
    ){

      snapToCenter(player);

      player.dir = {
        x:player.next.x,
        y:player.next.y
      };

      player.next = {
        x:0,
        y:0
      };

    }

  }

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

  tryPlayerTurn();

  moveEntity(player,dt);

  if(centered(player)){

    snapToCenter(player);

    tryPlayerTurn();

  }

  player.mouth += dt * .012;


  const cx =
    Math.floor(player.x);

  const cy =
    Math.floor(player.y);


  /* dots */

  for(const dot of dots){

    if(
      dot.alive &&
      dot.x === cx &&
      dot.y === cy
    ){

      dot.alive = false;

      dotsCollected++;

      addScore(10);

      beep(
        650,
        .025,
        "square",
        .012
      );

      spawn(
        player.x,
        player.y,
        3
      );

    }

  }


  /* power pellets */

  for(const pellet of pellets){

    if(
      pellet.alive &&
      pellet.x === cx &&
      pellet.y === cy
    ){

      pellet.alive = false;

      dotsCollected++;

      addScore(50);

      powerTimer = 7;

      combo = 0;

      ghosts.forEach(
        ghost => ghost.fright = 7
      );

      beep(
        180,
        .15,
        "sawtooth",
        .035
      );

      vibrate(30);

      spawn(
        player.x,
        player.y,
        14
      );

    }

  }


  if(
    !dots.some(dot=>dot.alive) &&
    !pellets.some(pellet=>pellet.alive)
  ){

    levelComplete();

  }

}


/* =========================================================
   GHOST AI
========================================================= */

function chooseGhostDir(ghost){

  const x =
    Math.floor(ghost.x);

  const y =
    Math.floor(ghost.y);


  let target;


  if(powerTimer > 0){

    target = {

      x:Math.floor(player.x) +
        (Math.random()>.5 ? 4 : -4),

      y:Math.floor(player.y) +
        (Math.random()>.5 ? 4 : -4)

    };

  }

  else if(ghost.type === 0){

    target = {

      x:Math.floor(player.x),
      y:Math.floor(player.y)

    };

  }

  else if(ghost.type === 1){

    target = {

      x:Math.floor(player.x) +
        player.dir.x * 4,

      y:Math.floor(player.y) +
        player.dir.y * 4

    };

  }

  else if(ghost.type === 2){

    target = {

      x:Math.floor(Math.random()*W),
      y:Math.floor(Math.random()*H)

    };

  }

  else{

    target =
      ghost.scatter
        ? {
            x:Math.floor(ghost.homeX),
            y:Math.floor(ghost.homeY)
          }
        : {
            x:Math.floor(player.x) -
              player.dir.y * 4,

            y:Math.floor(player.y) +
              player.dir.x * 4
          };

  }


  let options =
    dirs.filter(dir=>{

      const reverse =
        dir.x === -ghost.dir.x &&
        dir.y === -ghost.dir.y;

      if(reverse) return false;

      return !isWall(
        x+dir.x,
        y+dir.y
      );

    });


  if(!options.length){

    options =
      dirs.filter(
        dir =>
          !isWall(
            x+dir.x,
            y+dir.y
          )
      );

  }


  options.sort((a,b)=>{

    const da =
      (x+a.x-target.x)**2 +
      (y+a.y-target.y)**2;

    const db =
      (x+b.x-target.x)**2 +
      (y+b.y-target.y)**2;

    return powerTimer > 0
      ? db-da
      : da-db;

  });


  ghost.dir =
    options[
      Math.floor(
        Math.random() *
        Math.min(2,options.length)
      )
    ] || options[0];

}


/* =========================================================
   GHOST UPDATE
========================================================= */

function updateGhosts(dt){

  powerTimer =
    Math.max(
      0,
      powerTimer - dt/1000
    );


  ghosts.forEach(ghost=>{

    if(powerTimer <= 0){

      ghost.fright = 0;

    }else{

      ghost.fright = powerTimer;

    }


    if(centered(ghost)){

      snapToCenter(ghost);

      chooseGhostDir(ghost);

    }


    moveEntity(ghost,dt);


    const dx =
      ghost.x-player.x;

    const dy =
      ghost.y-player.y;

    const distance =
      dx*dx+dy*dy;


    if(distance < .36){

      if(ghost.fright > 0){

        const values =
          [200,400,800,1600];

        const value =
          values[
            Math.min(combo,3)
          ];

        addScore(value);

        combo++;

        ghost.x =
          ghost.homeX;

        ghost.y =
          ghost.homeY;

        ghost.dir =
          DIR.up;

        ghost.fright = 0;

        beep(
          880,
          .12,
          "square",
          .04
        );

        vibrate(35);

        spawn(
          player.x,
          player.y,
          18
        );

      }else{

        playerHit();

      }

    }


    ghost.phase += dt/1000;

    ghost.scatter =
      Math.floor(
        ghost.phase/6
      ) % 2 === 1;

  });

}


/* =========================================================
   PLAYER HIT
========================================================= */

function playerHit(){

  if(gameState !== "playing"){
    return;
  }

  lives--;

  updateHud();

  vibrate(100);

  beep(
    90,
    .22,
    "sawtooth",
    .045
  );

  spawn(
    player.x,
    player.y,
    20
  );


  if(lives <= 0){

    gameOver();

    return;

  }


  player.x = 14.5;
  player.y = 26.5;

  player.dir = {
    x:0,
    y:0
  };

  player.next = {
    x:0,
    y:0
  };


  ghosts.forEach((ghost,index)=>{

    ghost.x = ghost.homeX;
    ghost.y = ghost.homeY;
    ghost.dir = dirs[index%4];

  });

}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function levelComplete(){

  if(gameState !== "playing"){
    return;
  }

  gameState = "level";

  const bonus =
    500 + level*100;

  addScore(bonus);

  beep(700,.12);

  setTimeout(

  showMessage(

    `

        }
      }
    ]
  );

}

function pause(){

      .classList.add("show");

/* =========================================================
   PARTICLES
========================================================= */

function spawn(x,y,n){

  if(lowFx && n>7){
    n=7;
  }

  for(let i=0;i<n;i++){

    particles.push({

      x,
      y,

      vx:(Math.random()-.5)*.12,

      vy:(Math.random()-.5)*.12,

      life:.4+Math.random()*.6

    });

  }

}


function updateParticles(dt){

  particles.forEach(p=>{

    p.x += p.vx * dt;

    p.y += p.vy * dt;

    p.life -= dt/1000;

  });


  particles =
    particles.filter(
      p=>p.life>0
    );

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.save();

  ctx.translate(ox,oy);


  const glow = !lowFx;


  /* MAZE */

  for(let y=0;y<H;y++){

    for(let x=0;x<W;x++){

      if(!isWall(x,y)){
        continue;
      }


      ctx.fillStyle =
        "#06122a";

      ctx.fillRect(
        x*tile,
        y*tile,
        tile,
        tile
      );


      ctx.strokeStyle =
        glow
          ? "#159cff"
          : "#1473c2";

      ctx.lineWidth =
        Math.max(
          1,
          tile*.075
        );


      ctx.shadowBlur =
        glow
          ? tile*.45
          : 0;

      ctx.shadowColor =
        "#20a7ff";


      /* TOP */

      if(!isWall(x,y-1)){

        ctx.beginPath();

        ctx.moveTo(
          x*tile,
          y*tile+.5
        );

        ctx.lineTo(
          (x+1)*tile,
          y*tile+.5
        );

        ctx.stroke();

      }


      /* RIGHT */

      if(!isWall(x+1,y)){

        ctx.beginPath();

        ctx.moveTo(
          (x+1)*tile,
          y*tile
        );

        ctx.lineTo(
          (x+1)*tile,
          (y+1)*tile
        );

        ctx.stroke();

      }


      /* BOTTOM */

      if(!isWall(x,y+1)){

        ctx.beginPath();

        ctx.moveTo(
          x*tile,
          (y+1)*tile-.5
        );

        ctx.lineTo(
          (x+1)*tile,
          (y+1)*tile-.5
        );

        ctx.stroke();

      }


      /* LEFT */

      if(!isWall(x-1,y)){

        ctx.beginPath();

        ctx.moveTo(
          x*tile,
          y*tile
        );

        ctx.lineTo(
          x*tile,
          (y+1)*tile
        );

        ctx.stroke();

      }

    }

  }


  ctx.shadowBlur=0;


  /* DOTS */

  dots.forEach(dot=>{

    if(!dot.alive){
      return;
    }

    ctx.fillStyle =
      "#d9ecff";

    ctx.shadowBlur =
      glow ? 7 : 0;

    ctx.shadowColor =
      "#8ed5ff";

    ctx.beginPath();

    ctx.arc(
      (dot.x+.5)*tile,
      (dot.y+.5)*tile,
      tile*.10,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  /* POWER PELLETS */

  pellets.forEach(pellet=>{

    if(!pellet.alive){
      return;
    }

    const pulse =
      1 +
      Math.sin(
        performance.now()/130
      )*.18;

    ctx.fillStyle="#fff";

    ctx.shadowBlur =
      glow ? 18 : 0;

    ctx.shadowColor="#fff";

    ctx.beginPath();

    ctx.arc(
      (pellet.x+.5)*tile,
      (pellet.y+.5)*tile,
      tile*.25*pulse,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  ghosts.forEach(drawGhost);

  drawPlayer();


  /* PARTICLES */

  particles.forEach(p=>{

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle="#fff";

    ctx.shadowBlur=8;

    ctx.shadowColor="#9b45ff";

    ctx.beginPath();

    ctx.arc(
      p.x*tile,
      p.y*tile,
      tile*.08,
      0,
      Math.PI*2
    );

    ctx.fill();

  });


  ctx.globalAlpha=1;

  ctx.shadowBlur=0;

  ctx.restore();

}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

  const px =
    player.x*tile;

  const py =
    player.y*tile;

  const r =
    tile*.42;


  let angle = 0;


  if(player.dir.x===1){
    angle=0;
  }

  if(player.dir.x===-1){
    angle=Math.PI;
  }

  if(player.dir.y===1){
    angle=Math.PI/2;
  }

  if(player.dir.y===-1){
    angle=-Math.PI/2;
  }


  const mouth =
    (
      .16 +
      Math.abs(
        Math.sin(player.mouth)
      )*.22
    ) * Math.PI;


  ctx.fillStyle =
    "#ffe600";

  ctx.shadowBlur =
    lowFx ? 0 : 16;

  ctx.shadowColor =
    "#ffe600";


  ctx.beginPath();

  ctx.moveTo(
    px,
    py
  );

  ctx.arc(
    px,
    py,
    r,
    angle+mouth,
    angle+Math.PI*2-mouth
  );

  ctx.closePath();

  ctx.fill();

  ctx.shadowBlur=0;

}


/* =========================================================
   GHOST DRAW
========================================================= */

function drawGhost(ghost){

  const x =
    ghost.x*tile;

  const y =
    ghost.y*tile;

  const r =
    tile*.4;


  const color =
    ghost.fright>0
      ? (
          Math.floor(
            performance.now()/180
          )%2
            ? "#e9f7ff"
            : "#2d69ff"
        )
      : ghost.color;


  ctx.fillStyle=color;

  ctx.shadowBlur =
    lowFx ? 0 : 13;

  ctx.shadowColor=color;


  ctx.beginPath();

  ctx.arc(
    x,
    y-r*.05,
    r,
    Math.PI,
    0
  );


  ctx.lineTo(
    x+r,
    y+r*.75
  );

  ctx.lineTo(
    x+r*.55,
    y+r*.48
  );

  ctx.lineTo(
    x+r*.1,
    y+r*.75
  );

  ctx.lineTo(
    x-r*.35,
    y+r*.48
  );

  ctx.lineTo(
    x-r,
    y+r*.75
  );

  ctx.closePath();

  ctx.fill();

  ctx.shadowBlur=0;


  /* eyes */

  const eyeY =
    y-r*.15;

  const eyeLeft =
    x-r*.18;

  const eyeRight =
    x+r*.34;


  ctx.fillStyle="#fff";

  ctx.beginPath();

  ctx.arc(
    eyeLeft,
    eyeY,
    r*.14,
    0,
    Math.PI*2
  );

  ctx.arc(
    eyeRight,
    eyeY,
    r*.14,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#10204a";

  ctx.beginPath();

  ctx.arc(
    eyeLeft + ghost.dir.x*r*.06,
    eyeY + ghost.dir.y*r*.06,
    r*.07,
    0,
    Math.PI*2
  );

  ctx.arc(
    eyeRight + ghost.dir.x*r*.06,
    eyeY + ghost.dir.y*r*.06,
    r*.07,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =========================================================
   RESPONSIVE CANVAS
========================================================= */

function resizeCanvas(){

  if(!screens.game.classList.contains("active")){
    return;
  }


  const wrap =
    $("#boardWrap");

  const rect =
    wrap.getBoundingClientRect();


  const maxW =
    Math.max(50,rect.width-8);

  const maxH =
    Math.max(80,rect.height-8);


  tile =
    Math.max(
      4,
      Math.floor(
        Math.min(
          maxW/W,
          maxH/H
        )
      )
    );


  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    W*tile*dpr;

  canvas.height =
    H*tile*dpr;


  canvas.style.width =
    (W*tile)+"px";

  canvas.style.height =
    (H*tile)+"px";


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ox=0;
  oy=0;


  draw();

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now){

  raf =
    requestAnimationFrame(loop);


  if(gameState !== "playing"){
    return;
  }


  let dt =
    Math.min(
      34,
      now-last
    );


  last=now;


  updatePlayer(dt);

  updateGhosts(dt);

  updateParticles(dt);

  draw();

}


/* =========================================================
   INPUT
========================================================= */

function requestDir(name){

  const direction =
    DIR[name];

  if(!direction){
    return;
  }


  player.next = {
    x:direction.x,
    y:direction.y
  };


  if(gameState === "playing"){

    beep(
      220,
      .018,
      "square",
      .008
    );

  }

}


/* =========================================================
   SWIPE
========================================================= */

let swipeStart = null;


canvas.addEventListener(
  "pointerdown",
  event=>{

    if(settings.controls === "dpad"){
      return;
    }

    swipeStart = {

      x:event.clientX,
      y:event.clientY,
      id:event.pointerId

    };


    canvas.setPointerCapture?.(
      event.pointerId
    );


    event.preventDefault();

  },
  {passive:false}
);


canvas.addEventListener(
  "pointerup",
  event=>{

    if(
      !swipeStart ||
      settings.controls === "dpad"
    ){

      return;

    }


    const dx =
      event.clientX -
      swipeStart.x;

    const dy =
      event.clientY -
      swipeStart.y;


    swipeStart=null;


    const distance =
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      );


    if(distance < 24){
      return;
    }


    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      requestDir(
        dx>0
          ? "right"
          : "left"
      );

    }else{

      requestDir(
        dy>0
          ? "down"
          : "up"
      );

    }


    event.preventDefault();

  },
  {passive:false}
);


/* =========================================================
   D-PAD
========================================================= */

$$("[data-dir]").forEach(button=>{

  const fire = event=>{

    event.preventDefault();

    if(settings.controls !== "swipe"){

      requestDir(
        button.dataset.dir
      );

    }

  };


  button.addEventListener(
    "pointerdown",
    fire,
    {passive:false}
  );


  button.addEventListener(
    "touchstart",
    fire,
    {passive:false}
  );


  button.addEventListener(
    "touchend",
    event=>event.preventDefault(),
    {passive:false}
  );

});


/* =========================================================
   STOP BUTTON
========================================================= */

$(".center").addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    if(player){

      player.dir={
        x:0,
        y:0
      };

      player.next={
        x:0,
        y:0
      };

    }

  },
  {passive:false}
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  event=>{

    const key =
      event.key.toLowerCase();


    const map = {

      arrowup:"up",
      w:"up",

      arrowdown:"down",
      s:"down",

      arrowleft:"left",
      a:"left",

      arrowright:"right",
      d:"right"

    };


    if(map[key]){

      event.preventDefault();

      if(gameState === "playing"){

        requestDir(
          map[key]
        );

      }

    }


    if(
      key==="p" ||
      key==="escape"
    ){

      event.preventDefault();


      if(gameState === "playing"){

        pause();

      }
      else if(gameState === "paused"){

        resume();

      }

    }

  }
);


/* =========================================================
   TOUCH SCROLL PREVENTION
========================================================= */

document.addEventListener(
  "touchmove",
  event=>{

    if(
      screens.game.classList.contains(
        "active"
      )
    ){

      event.preventDefault();

    }

  },
  {passive:false}
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);


window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(
      resizeCanvas,
      120
    );
  }
);


document.addEventListener(
  "fullscreenchange",
  ()=>{
    setTimeout(
      resizeCanvas,
      120
    );
  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreen(){

  const element =
    document.documentElement;


  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();

    }else{

      await element.requestFullscreen();

    }

  }catch(error){

    toast(
      "Fullscreen is not available here"
    );

  }

}

/* =========================================================
   ACTION BINDING
========================================================= */

function bindActions(){

  $$("[data-action]").forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        handleAction(
          button.dataset.action
        );
      }
    );

  });

}


function bindDynamic(){

  $$("#infoPanel [data-action]")
    .forEach(button=>{

      button.onclick = ()=>{
        handleAction(
          button.dataset.action
        );
      };

    });

}


function handleAction(action){

  if(action==="play"){

    startGame();

  }


  if(action==="how"){

    showHowToPlay();

  }


  if(action==="scores"){

    showScores();

  }


  if(action==="settings"){

    refreshSettings();

    show("settings");

  }


  if(action==="about"){

    showAbout();

  }


  if(action==="menu"){

    hideOverlay();

    show("menu");

    gameState="menu";

    cancelAnimationFrame(raf);

  }


  if(action==="pause"){

    pause();

  }


  if(action==="resume"){

    resume();

  }


  if(action==="restart"){

    startGame();

  }


  if(action==="fullscreen"){

    fullscreen();

  }

}


/* =========================================================
   SETTINGS
========================================================= */

function refreshSettings(){

  $$("[data-setting]").forEach(button=>{

    const value =
      button.dataset.value;

    button.classList.toggle(
      "on",
      String(
        settings[
          button.dataset.setting
        ]
      ) === value
    );

  });

}


$$("[data-setting]").forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      const key =
        button.dataset.setting;

      const value =
        button.dataset.value;


      settings[key] =
        value === "true"
          ? true
          : value === "false"
            ? false
            : value;


      saveSettings();

      refreshSettings();


      if(
        key==="fullscreen" &&
        settings.fullscreen
      ){

        fullscreen();

      }


      if(key==="controls"){

        toast(
          "Controls: " +
          settings.controls.toUpperCase()
        );

      }


      if(key==="vibration"){

        vibrate(20);

      }

    }
  );

});


/* =========================================================
   INITIALIZE
========================================================= */

bindActions();

refreshSettings();

updateHud();
