<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MAZE CHOMP — Neon Arcade</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020208;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.game-shell{
  width:min(96vw,900px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

/* ================= HUD ================= */

.hud{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;

  background:rgba(12,8,25,.8);
  border:1px solid rgba(140,76,255,.45);
  border-radius:16px;

  box-shadow:
    0 0 20px rgba(140,76,255,.12),
    inset 0 0 20px rgba(32,167,255,.03);
}

.logo{
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
  text-shadow:
    0 0 8px #fff,
    0 0 18px #8c4cff;
}

.stats{
  display:flex;
  gap:20px;
  font-size:13px;
  color:#aaa2bd;
}

.stat strong{
  display:block;
  color:#fff;
  font-size:17px;
  margin-top:2px;
  text-shadow:0 0 8px #20a7ff;
}

.life-dots{
  display:flex;
  gap:5px;
  align-items:center;
}

.life{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ffd447;
  box-shadow:0 0 10px #ffd447;
}

.life.dead{
  opacity:.15;
  box-shadow:none;
}

/* ================= GAME ================= */

.game-wrap{
  position:relative;
  width:min(94vw,820px);
  aspect-ratio:1/1;

  border-radius:22px;
  padding:8px;

  background:
    linear-gradient(
      145deg,
      rgba(140,76,255,.45),
      rgba(32,167,255,.16),
      rgba(140,76,255,.25)
    );

  box-shadow:
    0 0 35px rgba(140,76,255,.18),
    0 20px 80px rgba(0,0,0,.7);
}

canvas{
  width:100%;
  height:100%;
  display:block;

  border-radius:17px;
  background:#03030a;

  touch-action:none;
}

/* ================= OVERLAY ================= */

.overlay{
  position:absolute;
  inset:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:17px;

  background:rgba(2,2,8,.68);
  backdrop-filter:blur(7px);

  z-index:10;
}

.overlay.hidden{
  display:none;
}

.panel{
  width:min(430px,88%);
  padding:32px 25px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(18,11,34,.96),
      rgba(5,5,13,.96)
    );

  border:1px solid rgba(140,76,255,.65);
  border-radius:24px;

  box-shadow:
    0 0 35px rgba(140,76,255,.25),
    0 25px 70px rgba(0,0,0,.7);
}

.panel h1{
  margin:0;

  font-size:clamp(30px,6vw,58px);
  font-weight:1000;
  letter-spacing:4px;

  text-shadow:
    0 0 8px #fff,
    0 0 20px #8c4cff,
    0 0 40px #20a7ff;
}

.panel p{
  margin:14px 0 22px;
  color:#aaa2bd;
  line-height:1.5;
}

button{
  border:0;
  outline:0;
  cursor:pointer;

  color:#fff;
  font-weight:800;
  letter-spacing:1px;

  background:
    linear-gradient(
      135deg,
      #8c4cff,
      #20a7ff
    );

  border-radius:13px;
  padding:13px 22px;

  box-shadow:
    0 0 15px rgba(140,76,255,.4);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 25px rgba(32,167,255,.55);
}

button:active{
  transform:scale(.96);
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.controls button{
  width:48px;
  height:42px;
  padding:0;

  font-size:19px;
  background:
    linear-gradient(
      145deg,
      #171025,
      #080711
    );

  border:1px solid rgba(140,76,255,.45);
}

.controls button:active{
  background:#8c4cff;
}

.dpad{
  display:grid;
  grid-template-columns:repeat(3,48px);
  grid-template-rows:repeat(3,42px);
  gap:6px;
}

.dpad button:nth-child(1){
  grid-column:2;
}

.dpad button:nth-child(2){
  grid-column:1;
  grid-row:2;
}

.dpad button:nth-child(3){
  grid-column:2;
  grid-row:2;
}

.dpad button:nth-child(4){
  grid-column:3;
  grid-row:2;
}

.dpad button:nth-child(5){
  grid-column:2;
  grid-row:3;
}

/* ================= ROTATE POPUP ================= */

.rotate-popup{
  position:fixed;
  inset:0;

  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(2,2,8,.82);
  backdrop-filter:blur(10px);

  padding:20px;
}

.rotate-popup.show{
  display:flex;
}

.rotate-card{
  width:min(360px,90vw);

  padding:28px 22px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #120b22,
      #05050d
    );

  border:1px solid #8c4cff;
  border-radius:22px;

  box-shadow:
    0 0 30px #8c4cff55,
    0 20px 60px #000b;

  animation:rotatePopupIn .3s ease;
}

@keyframes rotatePopupIn{
  from{
    opacity:0;
    transform:scale(.88) translateY(15px);
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.rotate-icon{
  font-size:48px;

  color:#20a7ff;

  text-shadow:
    0 0 12px #20a7ff,
    0 0 30px #8c4cff;

  animation:rotateIcon 1.5s linear infinite;
}

@keyframes rotateIcon{
  to{
    transform:rotate(360deg);
  }
}

.rotate-card h3{
  margin:8px 0;

  font-size:20px;

  text-shadow:
    0 0 10px #fff,
    0 0 20px #8c4cff;
}

.rotate-card p{
  color:#aaa2bd;

  line-height:1.5;
  font-size:14px;

  margin:10px 0 16px;
}

.rotate-card button{
  width:100%;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .game-shell{
    width:96vw;
    gap:8px;
  }

  .hud{
    padding:9px 11px;
    border-radius:13px;
  }

  .logo{
    font-size:13px;
    letter-spacing:1px;
  }

  .stats{
    gap:9px;
    font-size:10px;
  }

  .stat strong{
    font-size:14px;
  }

  .game-wrap{
    width:96vw;
    padding:5px;
    border-radius:17px;
  }

  canvas{
    border-radius:13px;
  }

  .overlay{
    inset:5px;
    border-radius:13px;
  }

  .panel{
    padding:24px 18px;
    border-radius:19px;
  }

  .panel h1{
    font-size:30px;
  }

  .panel p{
    font-size:13px;
  }

  .controls{
    margin-top:2px;
  }

  .dpad{
    grid-template-columns:repeat(3,42px);
    grid-template-rows:repeat(3,37px);
    gap:5px;
  }

  .controls button{
    width:42px;
    height:37px;
    font-size:16px;
  }
}

/* Landscape phones */
@media(max-height:500px) and (orientation:landscape){

  .game-shell{
    width:70vh;
  }

  .hud{
    position:fixed;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    width:70vh;
  }

  .game-wrap{
    width:78vh;
  }

  .controls{
    position:fixed;
    right:12px;
    bottom:10px;
  }
}
</style>
</head>

<body>

<div class="game-shell">

  <!-- HUD -->
  <div class="hud">

    <div class="logo">
      MAZE CHOMP
    </div>

    <div class="stats">

      <div class="stat">
        SCORE
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        BEST
        <strong id="best">0</strong>
      </div>

      <div class="stat">
        LEVEL
        <strong id="level">1</strong>
      </div>

      <div class="stat">
        LIVES
        <strong class="life-dots" id="lives">
          <span class="life"></span>
          <span class="life"></span>
          <span class="life"></span>
        </strong>
      </div>

    </div>
  </div>

  <!-- GAME -->
  <div class="game-wrap">

    <canvas id="game"></canvas>

    <div class="overlay" id="overlay">

      <div class="panel">

        <h1 id="overlayTitle">
          MAZE CHOMP
        </h1>

        <p id="overlayText">
          Navigate the neon maze, collect pellets,
          avoid the ghosts and survive as long as possible.
        </p>

        <button id="startBtn">
          START GAME
        </button>

      </div>

    </div>

  </div>

  <!-- D-PAD -->
  <div class="controls">

    <div class="dpad">

      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>

    </div>

  </div>

</div>


<!-- ROTATE POPUP -->

<div id="rotatePopup" class="rotate-popup">

  <div class="rotate-card">

    <div class="rotate-icon">
      ↻
    </div>

    <h3>
      ROTATE DEVICE
    </h3>

    <p>
      Rotate your phone for a better arcade experience.
    </p>

    <button id="closeRotatePopup">
      CONTINUE
    </button>

  </div>

</div>


<script>
/* =========================================================
   MAZE CHOMP — NEON ARCADE
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const levelEl = document.getElementById("level");
const livesEl = document.getElementById("lives");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("startBtn");

const rotatePopup = document.getElementById("rotatePopup");
const closeRotatePopup =
  document.getElementById("closeRotatePopup");


/* ================= CANVAS ================= */

const COLS = 28;
const ROWS = 31;

let tile = 20;

function resizeCanvas(){

  const size =
    Math.min(
      window.innerWidth * .94,
      window.innerHeight * .78,
      820
    );

  canvas.width = size;
  canvas.height = size;

  tile = size / COLS;
}

resizeCanvas();

window.addEventListener("resize",resizeCanvas);


/* ================= MAZE ================= */

/*
  # = wall
  . = pellet
  space = empty
*/

const originalMaze = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"######.##..........##.######",
"######.##.###  ###.##.######",
"#......##.#      #.##......#",
"#.####.##.#      #.##.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#....#.##....##....##.#....#",
"####.#.#####.##.#####.#.####",
"####.#.##..........##.#.####",
"#....#.##.########.##.#....#",
"#.####.##............##.####",
"#..........................#",
"############################"
];


/* ================= GAME STATE ================= */

let maze = [];

let player;
let ghosts = [];

let score = 0;
let best = Number(localStorage.getItem("mazeChompBest") || 0);

let level = 1;
let lives = 3;

let playing = false;
let paused = false;

let lastTime = 0;

let particles = [];

let shake = 0;


/* ================= DIRECTIONS ================= */

const DIRS = {

  up:{
    x:0,
    y:-1
  },

  down:{
    x:0,
    y:1
  },

  left:{
    x:-1,
    y:0
  },

  right:{
    x:1,
    y:0
  }

};


/* ================= MOBILE ================= */

function isMobile(){

  return window.matchMedia(
    "(pointer: coarse)"
  ).matches;
}


/* ================= PLAYER ================= */

function newPlayer(){

  const mobile = isMobile();

  return {

    x:14,
    y:18,

    dir:{
      x:0,
      y:0
    },

    next:{
      x:0,
      y:0
    },

    /*
      Desktop:
      .125

      Mobile:
      .095

      Mobile speed is intentionally
      moderated for easier control.
    */

    speed: mobile ? .095 : .125,

    mouth:0,

    alive:true
  };
}


/* ================= GHOST ================= */

function createGhost(x,y,type){

  return {

    x,
    y,

    startX:x,
    startY:y,

    dir:{
      x:0,
      y:0
    },

    type,

    speed:
      (
        isMobile()
          ? .060
          : .078
      )
      +
      level * .0035,

    color:
      type === 0 ? "#ff3b8d" :
      type === 1 ? "#20a7ff" :
      type === 2 ? "#ffb52e" :
                   "#c85cff"

  };
}


/* ================= INIT ================= */

function initMaze(){

  maze = [];

  for(let y=0;y<originalMaze.length;y++){

    maze[y] =
      originalMaze[y]
      .padEnd(COLS,"#")
      .split("");

  }

  /*
    Add pellets to empty walkable cells.
  */

  for(let y=0;y<maze.length;y++){

    for(let x=0;x<maze[y].length;x++){

      if(
        maze[y][x] === " " ||
        maze[y][x] === "."
      ){

        maze[y][x] = ".";
      }

    }

  }

  /*
    Clear player area.
  */

  maze[18][14] = " ";
  maze[18][13] = " ";
  maze[18][15] = " ";

  maze[17][14] = " ";
  maze[19][14] = " ";

}


function initGhosts(){

  ghosts = [

    createGhost(13,10,0),
    createGhost(14,10,1),
    createGhost(15,10,2),
    createGhost(16,10,3)

  ];
}


/* ================= RESET ================= */

function resetLevel(){

  initMaze();

  player = newPlayer();

  initGhosts();

  updateHUD();

}


/* ================= HUD ================= */

function updateHUD(){

  scoreEl.textContent = score;
  bestEl.textContent = best;
  levelEl.textContent = level;

  livesEl.innerHTML = "";

  for(let i=0;i<3;i++){

    const span =
      document.createElement("span");

    span.className =
      "life" +
      (i >= lives ? " dead" : "");

    livesEl.appendChild(span);

  }

}


/* ================= CELL ================= */

function cell(x,y){

  x = Math.floor(x);
  y = Math.floor(y);

  if(
    y < 0 ||
    y >= maze.length ||
    x < 0 ||
    x >= maze[y].length
  ){

    return "#";
  }

  return maze[y][x];
}


/* ================= WALKABLE ================= */

function canMove(x,y){

  return cell(x,y) !== "#";

}


/* ================= TURN ================= */

function tryTurn(){

  if(
    player.next.x === 0 &&
    player.next.y === 0
  ){

    return;
  }

  const nx =
    player.x +
    player.next.x * .18;

  const ny =
    player.y +
    player.next.y * .18;

  if(canMove(nx,ny)){

    player.dir = {
      x:player.next.x,
      y:player.next.y
    };

    player.next = {
      x:0,
      y:0
    };

  }

}


/* ================= PLAYER UPDATE ================= */

function updatePlayer(dt){

  tryTurn();

  const speed =
    player.speed *
    dt *
    60;

  const nx =
    player.x +
    player.dir.x * speed;

  const ny =
    player.y +
    player.dir.y * speed;

  if(canMove(nx,ny)){

    player.x = nx;
    player.y = ny;

  }else{

    player.dir = {
      x:0,
      y:0
    };

  }

  /*
    Wrap horizontal tunnel
  */

  if(player.x < -0.5){
    player.x = COLS - .5;
  }

  if(player.x > COLS - .5){
    player.x = -.5;
  }

  player.mouth += dt * 10;

  eatPellet();

}


/* ================= PELLET ================= */

function eatPellet(){

  const x =
    Math.floor(player.x);

  const y =
    Math.floor(player.y);

  if(
    maze[y] &&
    maze[y][x] === "."
  ){

    maze[y][x] = " ";

    score += 10;

    if(score > best){

      best = score;

      localStorage.setItem(
        "mazeChompBest",
        best
      );

    }

    createParticles(
      player.x,
      player.y,
      "#ffd447",
      8
    );

    shake = 2;

    checkLevelComplete();

    updateHUD();

  }

}


/* ================= LEVEL ================= */

function checkLevelComplete(){

  let pellets = 0;

  for(const row of maze){

    for(const c of row){

      if(c === "."){
        pellets++;
      }

    }

  }

  if(pellets === 0){

    level++;

    createParticles(
      player.x,
      player.y,
      "#20a7ff",
      30
    );

    resetLevel();

  }

}


/* ================= GHOST UPDATE ================= */

function updateGhosts(dt){

  ghosts.forEach(ghost => {

    /*
      Choose a new direction when
      approaching the center of a tile.
    */

    const cx =
      Math.round(ghost.x);

    const cy =
      Math.round(ghost.y);

    const nearCenter =
      Math.abs(ghost.x - cx) < .08 &&
      Math.abs(ghost.y - cy) < .08;

    if(nearCenter){

      ghost.x = cx;
      ghost.y = cy;

      chooseGhostDirection(ghost);

    }

    const speed =
      ghost.speed *
      dt *
      60;

    const nx =
      ghost.x +
      ghost.dir.x * speed;

    const ny =
      ghost.y +
      ghost.dir.y * speed;

    if(canMove(nx,ny)){

      ghost.x = nx;
      ghost.y = ny;

    }else{

      chooseGhostDirection(ghost);

    }

    /*
      Horizontal tunnel.
    */

    if(ghost.x < -.5){
      ghost.x = COLS - .5;
    }

    if(ghost.x > COLS - .5){
      ghost.x = -.5;
    }

  });

}


/* ================= GHOST AI ================= */

function chooseGhostDirection(ghost){

  const possible = [];

  for(const key in DIRS){

    const d = DIRS[key];

    /*
      Prevent immediate reverse when possible.
    */

    if(
      d.x === -ghost.dir.x &&
      d.y === -ghost.dir.y
    ){

      continue;
    }

    const nx =
      Math.round(ghost.x) + d.x;

    const ny =
      Math.round(ghost.y) + d.y;

    if(canMove(nx,ny)){

      possible.push(d);

    }

  }

  if(possible.length === 0){

    ghost.dir = {
      x:-ghost.dir.x,
      y:-ghost.dir.y
    };

    return;
  }


  /*
    Sometimes chase the player,
    sometimes choose random path.
  */

  if(Math.random() < .65){

    possible.sort((a,b)=>{

      const ax =
        Math.round(ghost.x) + a.x;

      const ay =
        Math.round(ghost.y) + a.y;

      const bx =
        Math.round(ghost.x) + b.x;

      const by =
        Math.round(ghost.y) + b.y;

      const da =
        Math.abs(ax-player.x) +
        Math.abs(ay-player.y);

      const db =
        Math.abs(bx-player.x) +
        Math.abs(by-player.y);

      return da-db;

    });

    ghost.dir = possible[0];

  }else{

    ghost.dir =
      possible[
        Math.floor(
          Math.random()*possible.length
        )
      ];

  }

}


/* ================= COLLISION ================= */

function checkGhostCollision(){

  for(const ghost of ghosts){

    const dx =
      player.x - ghost.x;

    const dy =
      player.y - ghost.y;

    const dist =
      Math.sqrt(
        dx*dx + dy*dy
      );

    if(dist < .55){

      loseLife();

      return;

    }

  }

}


/* ================= LOSE LIFE ================= */

function loseLife(){

  if(!player.alive){
    return;
  }

  player.alive = false;

  lives--;

  shake = 12;

  createParticles(
    player.x,
    player.y,
    "#ff3b8d",
    35
  );

  updateHUD();

  setTimeout(()=>{

    if(lives <= 0){

      gameOver();

    }else{

      player = newPlayer();

      ghosts.forEach((ghost,i)=>{

        ghost.x = ghost.startX;
        ghost.y = ghost.startY;

        ghost.dir = {
          x:0,
          y:0
        };

      });

    }

  },700);

}


/* ================= GAME OVER ================= */

function gameOver(){

  playing = false;

  overlayTitle.textContent =
    "GAME OVER";

  overlayText.innerHTML =
    `Final Score: <strong>${score}</strong><br>
     Best Score: <strong>${best}</strong>`;

  startBtn.textContent =
    "PLAY AGAIN";

  overlay.classList.remove("hidden");

}


/* ================= START ================= */

function startGame(){

  score = 0;

  level = 1;

  lives = 3;

  resetLevel();

  playing = true;

  paused = false;

  overlay.classList.add("hidden");

  overlayTitle.textContent =
    "MAZE CHOMP";

  startBtn.textContent =
    "START GAME";

  /*
    Show rotate popup only on mobile.
  */

  setTimeout(showRotatePopup,350);

}


/* ================= ROTATE POPUP ================= */

function showRotatePopup(){

  if(
    isMobile() &&
    window.innerWidth <= 600
  ){

    rotatePopup.classList.add("show");

  }

}


closeRotatePopup.addEventListener(
  "click",
  ()=>{

    rotatePopup.classList.remove("show");

  }
);


/* ================= PARTICLES ================= */

function createParticles(
  x,
  y,
  color,
  count
){

  for(let i=0;i<count;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      .02 + Math.random()*.08;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*speed,

      vy:
        Math.sin(angle)*speed,

      life:1,

      size:
        1.5 + Math.random()*3,

      color

    });

  }

}


function updateParticles(dt){

  particles.forEach(p=>{

    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;

    p.life -= dt * 2.5;

  });

  particles =
    particles.filter(
      p=>p.life > 0
    );

}


function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha =
      Math.max(0,p.life);

    ctx.fillStyle = p.color;

    ctx.shadowBlur = 12;
    ctx.shadowColor = p.color;

    ctx.beginPath();

    ctx.arc(
      p.x*tile,
      p.y*tile,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

}


/* ================= DRAW MAZE ================= */

function drawMaze(){

  for(let y=0;y<maze.length;y++){

    for(let x=0;x<maze[y].length;x++){

      const c = maze[y][x];

      if(c === "#"){

        /*
          Outer glow
        */

        ctx.shadowBlur = 10;
        ctx.shadowColor = "#8c4cff";

        ctx.fillStyle = "#100b20";

        ctx.fillRect(
          x*tile,
          y*tile,
          tile,
          tile
        );

        ctx.shadowBlur = 0;

        /*
          Inner wall
        */

        ctx.strokeStyle =
          "rgba(140,76,255,.65)";

        ctx.lineWidth =
          Math.max(1,tile*.06);

        ctx.strokeRect(
          x*tile+.5,
          y*tile+.5,
          tile-1,
          tile-1
        );

      }

      if(c === "."){

        const pulse =
          1 +
          Math.sin(
            performance.now()*.006 +
            x+y
          )*.25;

        ctx.fillStyle = "#ffd447";

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ffd447";

        ctx.beginPath();

        ctx.arc(
          (x+.5)*tile,
          (y+.5)*tile,
          Math.max(2,tile*.09)*pulse,
          0,
          Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;

      }

    }

  }

}


/* ================= DRAW PLAYER ================= */

function drawPlayer(){

  if(!player) return;

  const px =
    player.x * tile;

  const py =
    player.y * tile;

  const radius =
    tile*.38;

  let angle = 0;

  if(player.dir.x < 0)
    angle = Math.PI;

  else if(player.dir.y < 0)
    angle = -Math.PI/2;

  else if(player.dir.y > 0)
    angle = Math.PI/2;

  const mouth =
    .18 +
    Math.abs(
      Math.sin(player.mouth)
    )*.3;

  ctx.save();

  ctx.translate(px,py);

  ctx.rotate(angle);

  ctx.shadowBlur = 22;
  ctx.shadowColor = "#ffd447";

  ctx.fillStyle = "#ffd447";

  ctx.beginPath();

  ctx.moveTo(0,0);

  ctx.arc(
    0,
    0,
    radius,
    mouth,
    Math.PI*2-mouth
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();

  ctx.shadowBlur = 0;

}


/* ================= DRAW GHOSTS ================= */

function drawGhosts(){

  ghosts.forEach(ghost=>{

    const x =
      ghost.x * tile;

    const y =
      ghost.y * tile;

    const r =
      tile*.34;

    ctx.save();

    ctx.shadowBlur = 18;
    ctx.shadowColor = ghost.color;

    ctx.fillStyle =
      ghost.color;

    ctx.beginPath();

    /*
      Ghost head
    */

    ctx.arc(
      x,
      y-r*.15,
      r,
      Math.PI,
      0
    );

    /*
      Body
    */

    ctx.lineTo(
      x+r,
      y+r
    );

    ctx.lineTo(
      x+r*.45,
      y+r*.65
    );

    ctx.lineTo(
      x,
      y+r
    );

    ctx.lineTo(
      x-r*.45,
      y+r*.65
    );

    ctx.lineTo(
      x-r,
      y+r
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;

    /*
      Eyes
    */

    ctx.fillStyle = "#fff";

    ctx.beginPath();

    ctx.arc(
      x-r*.35,
      y-r*.18,
      r*.25,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+r*.35,
      y-r*.18,
      r*.25,
      0,
      Math.PI*2
    );

    ctx.fill();

    /*
      Pupils
    */

    ctx.fillStyle = "#171025";

    ctx.beginPath();

    ctx.arc(
      x-r*.35,
      y-r*.18,
      r*.11,
      0,
      Math.PI*2
    );

    ctx.arc(
      x+r*.35,
      y-r*.18,
      r*.11,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  });

}


/* ================= DRAW ================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.save();

  if(shake > 0){

    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );

    shake *= .85;

    if(shake < .1){
      shake = 0;
    }

  }

  /*
    Background
  */

  ctx.fillStyle = "#03030a";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawMaze();

  drawParticles();

  drawPlayer();

  drawGhosts();

  ctx.restore();

}


/* ================= GAME LOOP ================= */

function loop(time){

  const dt =
    Math.min(
      .035,
      (time-lastTime)/1000 || 0
    );

  lastTime = time;

  if(playing && !paused){

    updatePlayer(dt);

    updateGhosts(dt);

    checkGhostCollision();

    updateParticles(dt);

  }

  draw();

  requestAnimationFrame(loop);

}


/* ================= START BUTTON ================= */

startBtn.addEventListener(
  "click",
  startGame
);


/* ================= KEYBOARD ================= */

window.addEventListener(
  "keydown",
  e=>{

    const key =
      e.key.toLowerCase();

    if(
      key === "arrowup" ||
      key === "w"
    ){

      player.next = DIRS.up;

      e.preventDefault();

    }

    else if(
      key === "arrowdown" ||
      key === "s"
    ){

      player.next = DIRS.down;

      e.preventDefault();

    }

    else if(
      key === "arrowleft" ||
      key === "a"
    ){

      player.next = DIRS.left;

      e.preventDefault();

    }

    else if(
      key === "arrowright" ||
      key === "d"
    ){

      player.next = DIRS.right;

      e.preventDefault();

    }

    else if(key === "p"){

      paused = !paused;

    }

  }
);


/* ================= D-PAD ================= */

document
  .querySelectorAll(
    "[data-dir]"
  )
  .forEach(button=>{

    button.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();

        const dir =
          button.dataset.dir;

        if(player){

          player.next =
            DIRS[dir];

        }

      }
    );

  });


/* ================= SWIPE ================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const touch =
      e.changedTouches[0];

    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

  },
  {passive:true}
);


canvas.addEventListener(
  "touchend",
  e=>{

    const touch =
      e.changedTouches[0];

    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;

    const threshold = 20;

    if(
      Math.abs(dx) <
      threshold &&
      Math.abs(dy) <
      threshold
    ){

      return;

    }

    if(Math.abs(dx) > Math.abs(dy)){

      player.next =
        dx > 0
          ? DIRS.right
          : DIRS.left;

    }else{

      player.next =
        dy > 0
          ? DIRS.down
          : DIRS.up;

    }

  },
  {passive:true}
);


/* ================= INITIALIZE ================= */

bestEl.textContent = best;

initMaze();

player = newPlayer();

initGhosts();

updateHUD();

requestAnimationFrame(loop);
